<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FES Karyashala Web Repository — Wireframe Prototype</title>
<style>
/* ============================================================
   FES KARYASHALA — LOW-FIDELITY WIREFRAME PROTOTYPE
   Grayscale, structure-first. No brand color, no decoration.
   ============================================================ */
:root{
  --ink:#1f1f1f;
  --ink-2:#555;
  --ink-3:#7c7c7c;
  --line:#c9c9c9;
  --line-2:#e0e0e0;
  --bg:#f4f4f4;
  --panel:#ffffff;
  --panel-2:#fafafa;
  --fill:#ececec;
  --fill-2:#e2e2e2;
  --active:#2b2b2b;
  --radius:4px;
  --maxw:1160px;
  --gap:20px;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--ink);
  background:var(--bg);
  font-size:14px;
  line-height:1.5;
}
a{color:inherit}
img{max-width:100%}

/* ---------- Wireframe primitives ---------- */
.wf-note{font-size:11px;color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase}
.ph-img{
  background:
    repeating-linear-gradient(45deg,transparent,transparent 9px,#e6e6e6 9px,#e6e6e6 10px),
    var(--fill);
  border:1px solid var(--line);
  border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:12px;text-align:center;
  min-height:120px;
}
.ph-line{height:10px;background:var(--fill);border-radius:3px;margin:7px 0}
.ph-line.w80{width:80%}.ph-line.w60{width:60%}.ph-line.w40{width:40%}.ph-line.w90{width:90%}
.icon-box{
  width:34px;height:34px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel-2);display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;flex:0 0 auto;
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--ink);background:var(--panel);color:var(--ink);
  padding:9px 15px;border-radius:var(--radius);font-size:13px;cursor:pointer;
  text-decoration:none;white-space:nowrap;transition:background .12s;
}
.btn:hover{background:var(--fill)}
.btn.primary{background:var(--active);color:#fff;border-color:var(--active)}
.btn.primary:hover{background:#000}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.link{border:none;background:none;padding:4px 0;text-decoration:underline;color:var(--ink)}
.btn.block{width:100%;justify-content:center}

/* ---------- Layout ---------- */
.container{max-width:var(--maxw);margin:0 auto;padding:0 24px}
header.site{
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
}
.nav{display:flex;align-items:center;gap:18px;height:60px}
.logo{
  border:1.5px solid var(--ink);border-radius:var(--radius);
  padding:6px 10px;font-weight:700;letter-spacing:.04em;cursor:pointer;font-size:13px;
  flex:0 0 auto;
}
.logo small{display:block;font-weight:400;font-size:9px;color:var(--ink-3);letter-spacing:.08em}
.nav ul{list-style:none;display:flex;gap:2px;margin:0;padding:0;flex:1 1 auto;flex-wrap:wrap}
.nav a.navlink{
  text-decoration:none;color:var(--ink-2);font-size:13px;
  padding:7px 9px;border-radius:var(--radius);cursor:pointer;display:inline-block;
}
.nav a.navlink:hover{background:var(--fill)}
.nav a.navlink.active{color:var(--ink);background:var(--fill-2);font-weight:600}
.nav .search-btn{margin-left:auto}

/* Breadcrumbs */
.crumbs{padding:12px 0;font-size:12px;color:var(--ink-3)}
.crumbs a{color:var(--ink-2);text-decoration:none;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.crumbs span.sep{margin:0 7px;color:var(--line)}
.crumbs span.here{color:var(--ink);font-weight:600}

main{min-height:60vh;padding-bottom:40px}

/* Section scaffolding */
.section{padding:26px 0}
.section h2{font-size:20px;margin:0 0 4px}
.section .sub{color:var(--ink-2);margin:0 0 18px;max-width:720px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:8px}
.divider{border:none;border-top:1px solid var(--line-2);margin:0}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}

/* Grid */
.grid{display:grid;gap:var(--gap)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:var(--gap);flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Cards */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;gap:10px;
}
.card h3{margin:0;font-size:15px}
.card p{margin:0;color:var(--ink-2);font-size:13px}
.card .cta{margin-top:auto}
.card.click{cursor:pointer;transition:box-shadow .12s,transform .12s}
.card.click:hover{box-shadow:0 0 0 2px var(--ink);}

/* System card */
.syscard .ph-img{min-height:96px}
.syscard.small{padding:13px}
.syscard.small .ph-img{min-height:64px}

/* Hero */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:34px;margin-top:18px}
.hero h1{font-size:30px;margin:0 0 12px;line-height:1.2}
.hero p.lead{font-size:16px;color:var(--ink-2);max-width:640px;margin:0 0 20px}

/* Pathway */
.pathway{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.pw-step{
  flex:1 1 150px;min-width:140px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);padding:11px 12px;cursor:pointer;position:relative;transition:background .12s;
}
.pw-step:hover{background:var(--fill)}
.pw-step .num{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.pw-step .nm{font-size:13px;font-weight:600;margin-top:2px}
.pw-step.active{background:var(--active);border-color:var(--active)}
.pw-step.active .nm,.pw-step.active .num{color:#fff}
.pw-arrow{align-self:center;color:var(--line);font-size:16px}
.pathway.compact .pw-step{flex-basis:120px;min-width:110px;padding:8px 9px}

/* Resource card */
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:9px}
.rcard .rc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rcard h4{margin:0;font-size:14px;line-height:1.35}
.rcard .purpose{color:var(--ink-2);font-size:12.5px;margin:0}
.meta-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.tag.solid{background:var(--fill-2);border-color:var(--fill-2)}
.rc-actions{display:flex;gap:8px;margin-top:2px}
.rc-type-chip{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);border:1px dashed var(--line);border-radius:3px;padding:2px 6px}

/* Category columns (Learn / Facilitate / Act / Support) */
.cat-col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px}
.cat-head{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line-2);padding-bottom:9px}
.cat-head .lbl{font-weight:700;font-size:13px;letter-spacing:.04em}
.cat-head .desc{font-size:11px;color:var(--ink-3)}

/* Filter sidebar */
.layout-side{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:sticky;top:76px}
.fgroup{border-bottom:1px solid var(--line-2);padding:12px 0}
.fgroup:first-child{padding-top:0}
.fgroup h4{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.fopt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding:3px 0;cursor:pointer}
.fopt input{accent-color:var(--ink)}
.filter-actions{display:flex;gap:8px;margin-top:14px}

/* Search bar */
.searchfield{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:11px 14px}
.searchfield input{border:none;outline:none;flex:1;font-size:14px;background:transparent}
.searchfield .icon-box{width:28px;height:28px;font-size:14px}

/* Process / flow diagram */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flow .node{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:10px 14px;font-size:13px;text-align:center;min-width:96px}
.flow .node.strong{border-width:1.5px;font-weight:600}
.flow .arw{color:var(--ink-3);font-size:15px}

/* Model diagram */
.model{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative}
.model .m-node{border:1.5px solid var(--ink);border-radius:var(--radius);background:var(--panel);padding:18px 14px;text-align:center;font-weight:600}
.model-thread{margin-top:14px;border:1px dashed var(--ink);border-radius:var(--radius);padding:12px;text-align:center;background:var(--panel-2);font-weight:700;letter-spacing:.05em}

/* Stage reveal (home journey) */
.reveal{border:1px solid var(--line-2);border-top:none;border-radius:0 0 var(--radius) var(--radius);background:var(--panel-2);padding:14px;font-size:13px;color:var(--ink-2)}
.hidden{display:none}

/* Info list */
.qa{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.qa .qitem{border-bottom:1px solid var(--line-2)}
.qa .qitem:last-child{border-bottom:none}
.qa .qq{padding:13px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.qa .qq:hover{background:var(--panel-2)}
.qa .qa-body{padding:0 16px 14px;color:var(--ink-2);font-size:13px}

/* Context definition rows (resource detail) */
.ctx-row{border:1px solid var(--line-2);border-radius:var(--radius);padding:12px 14px;background:var(--panel)}
.ctx-row h5{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.ctx-row p{margin:0;color:var(--ink-2);font-size:13px}

/* Callout / recommended next */
.callout{border:1.5px solid var(--ink);border-radius:var(--radius);background:var(--panel-2);padding:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.callout .txt strong{display:block;font-size:14px}
.callout .txt span{font-size:13px;color:var(--ink-2)}

/* Video placeholder */
.video-ph{position:relative;min-height:170px}
.video-ph .play{width:52px;height:52px;border-radius:50%;border:2px solid var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-3)}

/* Footer */
footer.site{background:var(--panel);border-top:1px solid var(--line);margin-top:20px}
footer.site .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px;padding:30px 0}
footer.site h5{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
footer.site ul{list-style:none;margin:0;padding:0}
footer.site li{padding:4px 0;color:var(--ink-3);font-size:13px;cursor:pointer}
footer.site li:hover{color:var(--ink);text-decoration:underline}
footer .bar{border-top:1px solid var(--line-2);padding:14px 0;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* Search overlay */
.overlay{position:fixed;inset:0;background:rgba(30,30,30,.35);z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:9vh}
.overlay.open{display:flex}
.searchpanel{background:var(--panel);border:1px solid var(--ink);border-radius:var(--radius);width:min(620px,92vw);padding:20px}
.searchpanel h3{margin:0 0 4px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;background:var(--panel-2)}
.chip:hover{background:var(--fill)}

/* result rows */
.result-row{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.result-row .rr-main{flex:1}
.result-row h4{margin:0 0 3px;font-size:15px}

/* utility */
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb0{margin-bottom:0}
.muted{color:var(--ink-3)}
.stack{display:flex;flex-direction:column;gap:14px}
.wrapline{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px;margin:16px 0}
.wrapline::before,.wrapline::after{content:"";flex:1;border-top:1px solid var(--line-2)}
.pill-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}

/* Responsive */
@media(max-width:1000px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .layout-side{grid-template-columns:1fr}
  .filters{position:static}
  footer.site .cols{grid-template-columns:1fr 1fr}
  .model{grid-template-columns:1fr}
}
@media(max-width:640px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .nav ul{display:none}
  .hero h1{font-size:24px}
  footer.site .cols{grid-template-columns:1fr}
}
/* Prototype hint banner */
#proto-hint{position:fixed;bottom:12px;right:12px;z-index:50;background:var(--active);color:#fff;font-size:11px;padding:7px 12px;border-radius:20px;opacity:.85;cursor:pointer}
</style>
</head>

<div id="app"></div>

  <div class="searchpanel" id="search-panel"></div>

</div>

<script>
/* ============================================================
   DATA
   ============================================================ */
const STAGES = [
  {id:"understand", num:"01", name:"Understand Context", short:"Read the local social, ecological and institutional context before acting.", what:"Map the resource, the community, existing use patterns, power dynamics and prior institutions."},
  {id:"institutions", num:"02", name:"Build Institutions", short:"Form or strengthen a legitimate community institution to govern the commons.", what:"Convene the community, define membership, draft collective rules and decision-making norms."},
  {id:"tenure", num:"03", name:"Secure Tenure", short:"Establish legal recognition and secure rights over the shared resource.", what:"Prepare and file claims, gather evidence, engage authorities, obtain recognition of rights."},
  {id:"plan", num:"04", name:"Plan", short:"Develop a collective management and restoration plan.", what:"Set shared goals, zone the resource, agree priorities, sequence actions and resources."},
  {id:"restore", num:"05", name:"Restore & Manage", short:"Carry out restoration and day-to-day sustainable management.", what:"Implement restoration works, enforce collective rules, manage use and benefit-sharing."},
  {id:"monitor", num:"06", name:"Monitor & Adapt", short:"Track outcomes and adapt the approach over time.", what:"Measure ecological and institutional health, reflect, and revise rules and plans."}
];
const SYSTEMS = {
  forests:{name:"Forests", desc:"Community rights, institutions, collective governance, conservation and sustainable management.", process:"Understand → Institutions → Tenure → Plan → Restore → Monitor"},
  pastureland:{name:"Pastureland", desc:"Community institutions, tenure/recognition, collective rules, restoration and sustainable use.", process:"Understand → Institutions → Tenure → Plan → Restore → Monitor"},
  water:{name:"Water", desc:"Collective institutions, equitable access, planning, management and stewardship.", process:"Understand → Institutions → Access → Plan → Manage → Monitor"}
};
const THEMES = [
  {id:"map", name:"Multi-Actor Platforms", desc:"Convening and aligning multiple stakeholders around shared commons goals."},
  {id:"leo", name:"Local Economic Opportunities", desc:"Livelihoods and value from the sustainable use of the commons."},
  {id:"agri", name:"Sustainable Agriculture Practices", desc:"Practices that sustain soil, water and productivity over the long term."}
];
// 5-step orientation model (deck slide 1)
const JOURNEY5 = [
  {n:"1", k:"ORIENT", q:"What is this repository?", d:"Understand what the Karyashala Repository is and what it helps you do.", href:"#/about"},
  {n:"2", k:"UNDERSTAND", q:"What is Commoning?", d:"The meaning of Commoning of Commons.", href:"#/commoning"},
  {n:"3", k:"LEARN", q:"How does capacity building work?", d:"How continuous learning supports Commoning — and two methods of doing it.", href:"#/learning-approach"},
  {n:"4", k:"CHOOSE", q:"Pastureland / Forest / Water", d:"Select the natural-resource system or theme you are working with.", href:"#/resource-systems"},
  {n:"5", k:"ACT", q:"Use resources in sequence", d:"Access resources in a logical sequence to facilitate processes on the ground.", href:"#/library"}
];
// Commoning in Action — field stories (deck slide 4)
const STORIES = [
  {id:"gram-sabha-forest", title:"How a Gram Sabha strengthened governance of its Forest Commons", system:"Forests", stage:"Build Institutions", excerpt:"A village institution took charge of collective decisions and rules for its forest."},
  {id:"pasture-rules", title:"How communities developed rules for managing pasturelands", system:"Pastureland", stage:"Plan", excerpt:"Herders agreed shared grazing rules and a seasonal rest cycle for the common pasture."},
  {id:"water-access", title:"How a hamlet secured equitable access to a shared water source", system:"Water", stage:"Secure Tenure", excerpt:"Households negotiated fair access and a stewardship rota for the common water system."}
];
function storyById(id){return STORIES.find(s=>s.id===id)}
// Help topics — each gets its own page (deck slide 10 / help)
const HELP = [
  {id:"faq", title:"Frequently Asked Questions", desc:"Common questions about the repository."},
  {id:"how-to-use", title:"How to use the repository", desc:"Follow the guided journey or use direct access."},
  {id:"how-to-find", title:"How to find a resource", desc:"Use the Resource Library, search and filters."},
  {id:"commoning-stages", title:"Understanding Commoning stages", desc:"The six-stage Commoning pathway explained."},
  {id:"modular-learning", title:"Understanding Modular Learning", desc:"Progressive modules with field activity."},
  {id:"ldhf", title:"Understanding LDHF", desc:"Short, frequent, task-focused learning."}
];
function helpById(id){return HELP.find(h=>h.id===id)}
const FAQS = [
  ["How do I know which stage I am at?","Use the Commoning pathway on your resource-system page — the active stage is highlighted, and each stage explains what needs to happen."],
  ["Do I have to follow the whole journey?","No. Experienced users can go straight to the Resource Library, search and filter to a specific resource."],
  ["What is the difference between Learn, Facilitate, Act and Support?","Learn is knowledge, Facilitate is session plans, Act is field tools and tasks, Support is mentoring and FAQs."],
  ["Is the content available in Hindi?","Many resources are available in Hindi and English — filter by Language in the Resource Library."]
];
const CATS = [
  {id:"learn", lbl:"LEARN", desc:"Key concepts and knowledge", cta:"View Resource"},
  {id:"facilitate", lbl:"FACILITATE", desc:"Session plans and facilitation guides", cta:"View Guide"},
  {id:"act", lbl:"ACT", desc:"Field tools and tasks", cta:"Start Field Activity"},
  {id:"support", lbl:"SUPPORT", desc:"Mentoring, FAQs and guidance", cta:"Get Support"}
];
// A small realistic pool of resources
const RES = [
  {id:"facilitator-guide", title:"Facilitator Guide for Commoning", purpose:"End-to-end guide to facilitate the Commoning process with a community.", system:"All Systems", stage:"All Stages", stake:"Facilitator", design:"Modular", type:"Guide", lang:"English", time:"90 min", cat:"facilitate", tags:["Facilitator Guide","Modular","English"]},
  {id:"what-is-tenure", title:"What is Tenurial Security?", purpose:"Explains why secure tenure matters and the forms recognition can take.", system:"Forests", stage:"Secure Tenure", stake:"Learner", design:"LDHF", type:"Video", lang:"Hindi", time:"6 min", cat:"learn", tags:["Forest","Tenure","Video","Hindi"]},
  {id:"tenure-claim-tool", title:"Community Rights Claim Toolkit", purpose:"Step-by-step field tool to prepare and file a community rights claim.", system:"Forests", stage:"Secure Tenure", stake:"Field Practitioner", design:"Both", type:"Tool", lang:"Hindi", time:"Field task", cat:"act", tags:["Forest","Tenure","Tool","Hindi"]},
  {id:"tenure-session", title:"Secure Tenure — Session Plan", purpose:"Ready-to-run session plan to facilitate the tenure stage with the community.", system:"Forests", stage:"Secure Tenure", stake:"Facilitator", design:"Modular", type:"Training Material", lang:"English", time:"120 min", cat:"facilitate", tags:["Forest","Tenure","Facilitator Guide"]},
  {id:"tenure-mentoring", title:"Tenure Mentoring & FAQ", purpose:"Common questions and guided mentoring prompts for the tenure stage.", system:"Forests", stage:"Secure Tenure", stake:"Facilitator", design:"LDHF", type:"Supporting Resource", lang:"English", time:"15 min", cat:"support", tags:["Forest","Tenure","Support"]},
  {id:"context-mapping", title:"Context Mapping Worksheet", purpose:"A worksheet to map the resource, community and existing institutions.", system:"All Systems", stage:"Understand Context", stake:"Field Practitioner", design:"Both", type:"Tool", lang:"English", time:"Field task", cat:"act", tags:["Tool","Understand"]},
  {id:"institution-basics", title:"Building Community Institutions", purpose:"Foundations for forming a legitimate, inclusive community institution.", system:"All Systems", stage:"Build Institutions", stake:"Learner", design:"Modular", type:"Course", lang:"Hindi", time:"45 min", cat:"learn", tags:["Institutions","Course","Hindi"]},
  {id:"water-access-plan", title:"Equitable Water Access Planning", purpose:"Plan fair access and stewardship rules for a shared water system.", system:"Water", stage:"Plan", stake:"Facilitator", design:"Modular", type:"Guide", lang:"English", time:"60 min", cat:"facilitate", tags:["Water","Plan","Guide"]},
  {id:"restoration-field", title:"Pasture Restoration Field Protocol", purpose:"Field protocol for community-led pastureland restoration works.", system:"Pastureland", stage:"Restore & Manage", stake:"Field Practitioner", design:"Both", type:"Tool", lang:"Hindi", time:"Field task", cat:"act", tags:["Pastureland","Restore","Tool","Hindi"]},
  {id:"monitor-intro", title:"Monitoring & Adapting the Commons", purpose:"Simple indicators to track ecological and institutional health.", system:"All Systems", stage:"Monitor & Adapt", stake:"Learner", design:"LDHF", type:"Video", lang:"English", time:"8 min", cat:"learn", tags:["Monitor","Video"]}
];
function resById(id){return RES.find(r=>r.id===id)}

/* map a category id to a set of resources for a stage (demo mapping) */
function stageResources(catId){

/* Commoning pathway (reusable). activeId optional; system optional for links */
function pathway(activeId, opts={}){
  const compact=opts.compact?"compact":"";
  const sys=opts.system?`/${opts.system}`:"";
  const steps=STAGES.map((s,i)=>{
    const active=s.id===activeId?"active":"";
    const arrow=i<STAGES.length-1?`<div class="pw-arrow">→</div>`:"";
    return `<div class="pw-step ${active}" onclick="go('#/stage/${s.id}${sys?('?sys='+opts.system):''}')">
        <div class="num">${s.num}</div><div class="nm">${s.name}</div>
      </div>${arrow}`;
  }).join("");
  return `<div class="pathway ${compact}">${steps}</div>`;
}

function openContact(){document.getElementById("contact-panel").innerHTML=contactModalHTML();document.getElementById("contact-overlay").classList.add("open");}
function closeContact(){document.getElementById("contact-overlay").classList.remove("open");}

/* ============================================================
   ROUTER
   ============================================================ */
function parseHash(){
  const raw=(location.hash||"#/home").replace(/^#\//,"");
  const [pathPart,queryPart]=raw.split("?");
  const parts=pathPart.split("/").filter(Boolean);
  const params={};
  if(queryPart){queryPart.split("&").forEach(kv=>{const[k,v]=kv.split("=");params[k]=v;});}
  return {parts,params};
}
function render(){
  const {parts,params}=parseHash();
  const name=parts[0]||"home";
  let html;
  if(name==="system"){params.id=parts[1];html=screens.system(params);}
  else if(name==="stage"){params.id=parts[1];html=screens.stage(params);}
  else if(name==="resource"){params.id=parts[1];html=screens.resource(params);}
  else if(name==="story"){params.id=parts[1];html=screens.story(params);}
  else if(name==="help"&&parts[1]){params.id=parts[1];html=screens.helptopic(params);}
  else if(screens[name]){html=screens[name](params);}
  else{html=screens.home();}
  document.getElementById("app").innerHTML=html;
  window.scrollTo(0,0);
}
function go(hash){ if(location.hash===hash){render();} else {location.hash=hash;} }
window.addEventListener("hashchange",render);

/* ============================================================
   UI HELPERS
   ============================================================ */
function toggleReveal(id){const el=document.getElementById(id);if(el)el.classList.toggle("hidden");}
function applyFilterFlash(){ /* wireframe: filter state is illustrative */ }
let toastTimer;
function toast(msg){
  let t=document.getElementById("wf-toast");
  if(!t){t=document.createElement("div");t.id="wf-toast";
    t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2b2b;color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;z-index:80;max-width:80vw";
    document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity="1";
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.style.opacity="0";},1800);
}
document.getElementById("search-overlay").addEventListener("click",e=>{if(e.target.id==="search-overlay")closeSearch();});
document.getElementById("contact-overlay").addEventListener("click",e=>{if(e.target.id==="contact-overlay")closeContact();});
document.getElementById("proto-hint").addEventListener("click",()=>toast("This is a low-fidelity wireframe. Grayscale by design — structure over styling."));

/* boot */
if(!location.hash) location.hash="#/home";
render();
