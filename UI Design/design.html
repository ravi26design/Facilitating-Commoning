.fbtn .sw{width:.85rem;height:.85rem;border-radius:.25rem;background:var(--line);border:1px solid var(--line-2);flex:none}
.fbtn.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 10px 20px -12px rgba(78,124,89,.7)}
.fbtn.active .sw{background:#fff;border-color:#fff}
.fbtn i,.fbtn svg.lucide{width:1rem;height:1rem;flex:none}
.mapbadge{position:absolute;top:.85rem;left:.85rem;background:var(--blue);color:#fff;font-size:.72rem;font-weight:700;
  padding:.3rem .75rem;border-radius:999px;z-index:3;box-shadow:0 8px 18px -8px rgba(78,124,89,.6)}
.mapwrap{position:relative;min-height:28rem;background:var(--card);display:grid;place-items:center;overflow:hidden}
.filterpanel{background:var(--card);border:1px solid var(--line);padding:1.15rem;box-shadow:var(--shadow-card)}
.fp-head{display:flex;align-items:center;gap:.5rem;font-size:1rem;color:var(--ink);margin-bottom:.9rem}
.fp-head b{font-weight:800;flex:1}
.fp-head i,.fp-head svg.lucide{width:1.05rem;height:1.05rem;color:var(--ink)}
.fp-search{max-width:none;margin-bottom:.65rem}
.fp-grid{display:grid;grid-template-columns:1fr;gap:.5rem}
.fp-grid select{font-size:.85rem;padding:.55rem 2.1rem .55rem .8rem}
.fp-grid select:disabled{color:var(--faint);background:var(--bg-soft);cursor:not-allowed}
.leafmap{width:100%;height:34rem;z-index:1}
.leafmap .leaflet-container{font-family:var(--sans)}
.mkpin{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-size:.78rem;
  font-weight:800;border:2px solid #fff;box-shadow:0 6px 14px -4px rgba(20,30,60,.65)}
.sgpin{display:block;width:100%;height:100%;border-radius:50%;border:3px solid;box-shadow:0 5px 12px -4px rgba(20,30,60,.6)}
.sgpin.on{box-shadow:0 6px 16px -4px rgba(20,30,60,.7)}
.mapstats{font-size:.8rem;font-weight:600;color:var(--muted-2)}
.mapstats b{color:var(--ink);font-weight:800}
.leaflet-popup-content{font-size:.85rem;color:var(--ink);line-height:1.5}
.leaflet-popup-content b{font-weight:800}
@media(max-width:700px){.leafmap{height:24rem}}
.mapwrap>img{width:100%;height:auto;display:block}

/* ---- landscape pin hover cards ---- */
.lpin-card{position:absolute;width:19rem;max-width:80vw;background:var(--card);border:1px solid var(--line-2);border-radius:0;
  box-shadow:0 22px 50px -18px rgba(74,66,62,.55);padding:.9rem;display:none;z-index:30;white-space:normal;cursor:default;text-align:left}
.lpin:hover .lpin-card,.lpin:focus-within .lpin-card{display:block}
.lpin-card.down{top:calc(100% + .5rem);left:0}
.lpin-card.right{top:calc(100% + .5rem);right:0;left:auto}
.lpin-card.up{bottom:calc(100% + .5rem);left:0}
.lpin-card.center{left:50%;transform:translateX(-50%)}
.lc-ill{display:grid;place-items:center;height:7.5rem;border-radius:.6rem;background:var(--bg-soft);border:1px solid var(--line);
  margin-bottom:.7rem;overflow:hidden}
.lc-ill img{max-width:100%;max-height:100%;object-fit:contain}
.lc-ill .ic-tile{width:3rem;height:3rem}
.lc-title{display:block;font-size:.92rem;font-weight:800;color:var(--ink);margin-bottom:.3rem}
.lc-desc{display:block;font-size:.8rem;line-height:1.6;color:var(--muted);font-weight:500;letter-spacing:0}

/* ---- success modal ---- */
.modal-back{position:fixed;inset:0;background:rgba(20,28,60,.58);z-index:95;display:flex;
  align-items:center;justify-content:center;padding:1.5rem}
.modal-card{background:var(--card);border-radius:0;box-shadow:0 30px 70px -20px rgba(20,30,80,.55);width:min(31rem,100%);
  padding:2.5rem 2.25rem 2rem;text-align:center;position:relative}
/* the tour reads as a numbered sequence, joined by a line down the markers */
.tour{list-style:none;margin:.5rem 0 0;padding:0}
.tour li{position:relative}
.tour li:not(:last-child):after{content:"";position:absolute;left:1.85rem;top:3rem;bottom:.1rem;
  width:2px;background:var(--line)}
.tour-step{display:flex;align-items:flex-start;gap:.9rem;width:100%;border:0;border-left:3px solid transparent;
  background:none;padding:.7rem .7rem .7rem .55rem;font:inherit;text-align:left;cursor:pointer;
  transition:background .15s,border-color .15s}
.tour-step:hover{background:var(--bg-soft);border-left-color:var(--green)}
.tour-n{position:relative;z-index:1;flex:none;width:2.3rem;height:2.3rem;display:grid;place-items:center;
  border-radius:999px;background:var(--green-soft);border:1px solid var(--green-line);
  font-family:var(--mono);font-size:.82rem;font-weight:700;color:var(--green-d);transition:.15s}
.tour-step:hover .tour-n{background:var(--green);border-color:var(--green);color:#fff}
.tour-tx{flex:1;min-width:0;max-width:34rem}
.tour-tx em{display:inline-flex;align-items:center;gap:.35rem;font-style:normal;font-size:.66rem;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;color:var(--green-d)}
.tour-tx em i,.tour-tx em svg.lucide{width:.85rem;height:.85rem}
.tour-tx b{display:block;font-size:1rem;font-weight:800;color:var(--ink);line-height:1.4;margin-top:.3rem}
.tour-tx span{display:block;font-size:.87rem;color:var(--muted);line-height:1.6;margin-top:.25rem}
.tour-go{flex:none;align-self:center;color:var(--faint);opacity:.35;transition:opacity .15s,transform .15s}
.tour-step:hover .tour-go{opacity:1;transform:translateX(3px);color:var(--green-d)}
.tour-go i,.tour-go svg.lucide{width:1rem;height:1rem}
.tour-step:hover .tour-go{color:var(--green-d);transform:translateX(3px)}

.modal-x{position:absolute;top:.85rem;right:.85rem;width:2rem;height:2rem;border-radius:0;border:1px solid var(--line-2);
  background:#fff;color:var(--muted);display:grid;place-items:center}
.modal-x:hover{background:var(--bg-soft);color:var(--ink)}
.modal-x i,.modal-x svg.lucide{width:1rem;height:1rem}
.modal-ic{width:4rem;height:4rem;border-radius:50%;background:var(--green-soft);border:1px solid var(--green-line);
  color:var(--green-d);display:grid;place-items:center;margin:0 auto 1.1rem}
.modal-ic i,.modal-ic svg.lucide{width:1.9rem;height:1.9rem}


/* ============================================================
   FACILITATING COMMONING — components added in the same language
   ============================================================ */

/* resource-system / theme accents */
:root{
  --s-forests:#3f6549;    --s-forests-s:#edf3ee;
  --s-pastureland:#d4a24c;--s-pastureland-s:#fbf4e7;
  --s-water:#3d7b8c;      --s-water-s:#eaf2f4;
  --s-map:#4e7c59;        --s-map-s:#edf3ee;
  --s-leo:#4a8f86;        --s-leo-s:#eaf4f2;
  --s-agri:#c46a4a;       --s-agri-s:#fbeee9;
}

/* ---- six-stage commoning pathway ---- */
.pathway{--pc:var(--blue);display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:.5rem 0 .25rem}
.pw-step{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;
  gap:.55rem;padding:0 .4rem;cursor:pointer;background:none;border:0}
/* the rail strengthens step by step, so the row reads left to right */
.pw-step::before,.pw-step::after{content:'';position:absolute;top:calc(3.525rem - 1.5px);height:3px;z-index:0;
  background:var(--pc);opacity:calc(.16 + var(--i) * .055)}
.pw-step::before{left:0;right:50%}
.pw-step::after{left:50%;right:0;opacity:calc(.19 + var(--i) * .055)}
.pw-step:first-child::before,.pw-step:last-child::after{display:none}
/* the step number */
.pw-num{height:1.1rem;line-height:1.1rem;font-family:var(--mono);font-size:.7rem;font-weight:800;
  letter-spacing:.12em;color:var(--pc);opacity:.85;transition:opacity .18s}
/* the node — a filled tint, not a hairline ring */
.pw-node{position:relative;z-index:1;display:grid;place-items:center;width:3.75rem;height:3.75rem;border-radius:50%;
  background:color-mix(in srgb,var(--pc) 9%,#fff);border:2px solid color-mix(in srgb,var(--pc) 55%,transparent);
  color:var(--pc);box-shadow:0 0 0 5px #fff,0 3px 12px rgba(74,66,62,.09);
  transition:transform .18s,background .18s,color .18s,border-color .18s,box-shadow .18s}
.pw-node i,.pw-node svg.lucide{width:1.5rem;height:1.5rem;stroke-width:1.9}
.pw-step .nm{font-size:.92rem;font-weight:700;color:var(--ink);line-height:1.3;max-width:9.5rem;margin-top:.15rem}
/* hover */
.pw-step:hover .pw-node{background:var(--pc);border-color:var(--pc);color:#fff;transform:translateY(-4px);
  box-shadow:0 0 0 5px #fff,0 16px 28px -12px color-mix(in srgb,var(--pc) 70%,transparent)}
.pw-step:hover .pw-num{opacity:1}
.pw-step:hover .nm{color:var(--pc)}
/* stages already completed */
.pw-step.done{--pc:var(--green)}
.pw-step.done::before,.pw-step.done::after{background:var(--green);opacity:1}
.pw-step.done .pw-node{background:var(--green);border-color:var(--green);color:#fff}
.pw-step.done .pw-num{color:var(--green-d);opacity:1}
.pw-step.done .nm{color:var(--green-d)}
/* the stage you are on */
.pw-step.active::before{background:var(--green);opacity:1}
.pw-step.active .pw-num{opacity:1}
.pw-step.active .pw-node{background:var(--pc);border-color:var(--pc);color:#fff;
  box-shadow:0 0 0 5px #fff,0 0 0 9px color-mix(in srgb,var(--pc) 18%,transparent),
    0 16px 28px -14px color-mix(in srgb,var(--pc) 75%,transparent)}
.pw-step.active .nm{color:var(--pc);font-weight:800}
/* shown for reference only */
.pw-step.readonly{cursor:default}
.pw-step.readonly:hover .pw-node{background:color-mix(in srgb,var(--pc) 9%,#fff);
  border-color:color-mix(in srgb,var(--pc) 55%,transparent);color:var(--pc);transform:none;
  box-shadow:0 0 0 5px #fff,0 3px 12px rgba(74,66,62,.09)}
.pw-step.readonly:hover .nm{color:var(--ink)}
.pw-step.readonly.done:hover .pw-node{background:var(--green);border-color:var(--green);color:#fff}
.pw-step.readonly.done:hover .nm{color:var(--green-d)}
@media(max-width:1080px){
  .pathway{grid-template-columns:repeat(3,1fr);row-gap:2rem}
  .pw-step:nth-child(3)::after,.pw-step:nth-child(4)::before{display:none}
}
@media(max-width:680px){
  .pathway{grid-template-columns:repeat(2,1fr)}
  .pw-step::before,.pw-step::after{display:none}
}

/* ---- editorial page head (shared with the home hero) ---- */
.ehero.bare .in{padding-bottom:1rem}
/* a section straight after the page head must not stack a second full pad */
.ehero + .section{padding-top:2.25rem}
.ehero + .section.tight{padding-top:2rem}
/* two sections in a row (e.g. search then results) sit closer together */
.section + .section{padding-top:2.75rem}
.section.tight + .section{padding-top:2.5rem}
.section.wide,.section + .section.wide,.section.tight + .section.wide,
.section.bleed,.section + .section.bleed,.section.tight + .section.bleed{padding:0}
.chapsec .chapter{margin-bottom:0}
.ehero .kicker{display:block;margin-bottom:.85rem;color:var(--green-d)}
.ehero .kicker.accent{color:var(--tc,var(--green-d))}
.ehero .stand .row{margin-top:1.5rem}
.ehero .stand p+.row{margin-top:1.75rem}
@media(max-width:900px){.ehero .stand .row{justify-content:flex-start}}
/* a page head gives the title the room it needs; the actions size to content.
   The home hero keeps the even two-column split. */
.ehero.page .in{grid-template-columns:minmax(0,1fr) auto;gap:2rem;padding-bottom:1.5rem}
.ehero.page h1{max-width:none}
@media(max-width:900px){.ehero.page .in{grid-template-columns:1fr}}
/* the standfirst sits under the title */
.ehero .ph-lead{min-width:0}
.ehero .ph-sub{margin:.85rem 0 0;font-size:1.02rem;line-height:1.65;color:var(--muted);max-width:44rem}
/* the actions sit level with the title, hard right */
.ehero .stand>.row:first-child{margin-top:.35rem;justify-content:flex-end}
@media(max-width:900px){.ehero .stand>.row:first-child{justify-content:flex-start}}
@media(max-width:900px){.ehero .stand>.row:first-child{justify-content:flex-start}}

/* an illustrated chapter image is shown whole rather than cropped */
.chapshot.art{aspect-ratio:auto;background:#fff;display:grid;place-items:center;padding:0}
.chapshot.art img{width:100%;height:auto;object-fit:contain}

/* ---- confirmation dialog ---- */
#ov-confirm{align-items:center}
.cf-ic{width:3rem;height:3rem;border-radius:50%;background:var(--red-soft);color:var(--red);
  display:grid;place-items:center;margin-bottom:1.1rem}
.cf-ic i,.cf-ic svg.lucide{width:1.4rem;height:1.4rem}
.cf-title{font-size:1.15rem;font-weight:800;color:var(--ink);margin:0 0 .5rem}
.cf-body{font-size:.92rem;color:var(--muted);line-height:1.65;margin:0 0 1.6rem}
.cf-body strong{color:var(--ink)}
.btn-danger{background:var(--red);color:#fff;box-shadow:0 8px 18px -8px rgba(196,106,74,.55)}
.btn-danger:hover{background:#a9583c;transform:translateY(-1px)}

/* ---- a search field with an action beside it ---- */
.searchrow{display:flex;align-items:center;gap:.85rem;flex-wrap:wrap}
.searchrow .searchwrap{flex:1 1 22rem;min-width:0}
.searchrow>.btn{flex:none;padding:.95rem 1.35rem}
@media(max-width:620px){.searchrow>.btn{width:100%}}

/* ---- framed infographic ---- */
.infographic{position:relative;margin:0;background:transparent;border:0;box-shadow:none;padding:0;
  overflow:hidden;cursor:zoom-in}
/* the whole figure has to be readable in one frame — never taller than the
   viewport, so nothing needs scrolling to be seen */
.infographic img{width:100%;height:auto;max-height:76vh;object-fit:contain;display:block;margin:0 auto}
.infographic figcaption{font-size:.8rem;color:var(--muted-2);text-align:center;padding:.85rem .5rem 0}
.ig-zoom{position:absolute;right:1.15rem;bottom:1.15rem;display:inline-flex;align-items:center;gap:.4rem;
  background:rgba(74,66,62,.92);color:#fff;font-size:.76rem;font-weight:700;padding:.4rem .75rem;
  border-radius:999px;opacity:0;transform:translateY(4px);transition:.18s;pointer-events:none}
.ig-zoom i,.ig-zoom svg.lucide{width:.85rem;height:.85rem}
.infographic:hover .ig-zoom{opacity:1;transform:translateY(0)}
/* full-size viewer */
#ov-img{align-items:center;padding:1.5rem}
#ov-img .modal{width:min(94rem,100%);max-height:92vh;overflow:auto;padding:1rem}
.lb-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.85rem}
.lb-head span{font-size:.92rem;font-weight:700;color:var(--ink)}
.lb-img{width:100%;height:auto;display:block}

/* ---- five module cards (modular training design) ---- */
.modgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1.25rem}
.modcard{position:relative;display:flex;flex-direction:column;gap:.6rem;background:var(--card);
  border:1px solid var(--line);border-top:3px solid var(--mc,var(--blue));padding:1.25rem 1.35rem 1.35rem;
  box-shadow:var(--shadow-card);transition:transform .18s,box-shadow .2s}
.modcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.modcard .mc-top{display:flex;align-items:center;gap:.7rem}
.mc-ring{display:grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;flex:none;
  border:3px solid var(--mc,var(--blue));color:var(--mc,var(--blue))}
.mc-ring i,.mc-ring svg.lucide{width:1.15rem;height:1.15rem}
.mc-no{font-family:var(--mono);font-size:.68rem;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mc,var(--blue))}
.modcard h4{font-size:.98rem;line-height:1.35;margin:.1rem 0 0}
.modcard p{font-size:.87rem;color:var(--muted);line-height:1.6}
.mc-tot{display:flex;align-items:flex-start;gap:.5rem;margin-top:auto;padding-top:.8rem;
  border-top:1px dashed var(--line-2);font-size:.8rem;color:var(--muted-2);line-height:1.5}
.mc-tot b{display:block;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  color:var(--mc,var(--blue));margin-bottom:.15rem}
.mc-tot i,.mc-tot svg.lucide{width:.95rem;height:.95rem;color:var(--mc,var(--blue));flex:none;margin-top:.15rem}

/* ---- resource-system introduction panel ---- */

/* ---- dummy document previews in the listing ---- */
.pv-page{background:#fff;border:1px solid var(--line-2);border-radius:.2rem;padding:.7rem .75rem;
  box-shadow:0 6px 16px -12px rgba(74,66,62,.5);overflow:hidden;display:flex;flex-direction:column;gap:.3rem}
.pv-bar{height:.28rem;width:2.2rem;border-radius:2px;margin-bottom:.25rem}
.pv-t{height:.42rem;background:var(--ink);opacity:.82;border-radius:2px;width:78%}
.pv-t.sm{height:.3rem;width:46%;opacity:.34}
.pv-p{height:.22rem;background:var(--line-2);border-radius:2px;width:100%}
.pv-tbl{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:.22rem;margin-top:.2rem}
.pv-tbl span{height:.34rem;background:var(--line-2);border-radius:1px}
.pv-tbl span.lo{opacity:.5}
.pv-media{position:relative;display:grid;place-items:center;border-radius:.3rem;overflow:hidden;
  background:linear-gradient(135deg,#3b3531,#4a423e)}
.pv-media.audio{background:linear-gradient(135deg,#4a423e,#a06a8c)}
.pv-play{display:grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:50%;
  background:rgba(255,255,255,.94);color:var(--ink)}
.pv-play i,.pv-play svg.lucide{width:.95rem;height:.95rem;margin-left:.06rem}
.pv-media.audio .pv-play i,.pv-media.audio .pv-play svg.lucide{margin-left:0}
.pv-dur{position:absolute;right:.4rem;bottom:.4rem;font-size:.62rem;font-weight:700;color:#fff;
  background:rgba(0,0,0,.5);border-radius:.2rem;padding:.05rem .3rem}

/* ---- system tag — a soft pill tinted to its resource system ---- */
.systag{display:inline-flex;align-items:center;gap:.45rem;border:0;padding:.3rem .7rem .3rem .55rem;
  border-radius:999px;background:var(--st-s,var(--chip));color:var(--st,var(--ink));
  font:inherit;font-size:.78rem;font-weight:700;letter-spacing:.01em;line-height:1.3;
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;transition:filter .15s,transform .15s}
.systag::before{content:'';width:.5rem;height:.5rem;border-radius:50%;background:var(--st,var(--ink));flex:none}
.systag:hover{filter:brightness(.96);transform:translateY(-1px)}

/* ---- eyebrow-led section head ---- */
.shead{margin-bottom:1.6rem}
.shead h2{font-size:1.55rem;margin:.85rem 0 .5rem}
.shead p{color:var(--muted);max-width:52rem;font-size:.98rem}
.mb0{margin-bottom:0}

/* ---- approach equation: inputs = outcomes ---- */
@media(max-width:1180px){.equation{grid-template-columns:1fr}}
@media(max-width:700px){.eq-row{flex-direction:column}}
/* the outcomes read as the result, in green */
/* the operators */
@media(max-width:1180px){.eq-equals{margin:0 auto;transform:rotate(90deg)}}
@media(max-width:700px){.eq-op{transform:none;margin:0 auto}.eq-equals{transform:none}}

/* ---- closing note under the common-thread flow ---- */

/* ---- system / theme photo card ---- */
.syscard{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  overflow:hidden;cursor:pointer;box-shadow:none;
  transition:transform .18s ease,border-color .15s}
.syscard:hover{transform:translateY(-3px);border-color:var(--tc)}
.syscard::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--tc);z-index:3;
  transform:scaleX(0);transform-origin:left;transition:transform .28s ease}
.syscard:hover::after{transform:scaleX(1)}
.sc-photo{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg-soft);border-bottom:1px solid var(--line)}
.sc-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.syscard:hover .sc-photo img{transform:scale(1.045)}
.sc-body{padding:1.1rem 1.25rem 1.3rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.sc-body h3{font-size:1.08rem;line-height:1.25}
.sc-body p{font-size:.88rem;color:var(--muted);line-height:1.6}
.sc-go{display:inline-flex;align-items:center;gap:.35rem;margin-top:auto;padding-top:.75rem;
  font-size:.82rem;font-weight:700;color:var(--tc)}
.sc-go i,.sc-go svg.lucide{width:.9rem;height:.9rem;transition:transform .15s}
.syscard:hover .sc-go i,.syscard:hover .sc-go svg.lucide{transform:translateX(3px)}

/* ---- learning-design option card ---- */
.ldgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.35rem}
@media(max-width:980px){.ldgrid{grid-template-columns:1fr}}
.ldcard{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  overflow:hidden;cursor:pointer;box-shadow:var(--shadow-card);transition:transform .18s,box-shadow .2s,border-color .15s}
.ldcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:var(--line-2)}
.ld-top{position:relative;aspect-ratio:16/8;display:grid;place-items:center;overflow:hidden;
  border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--blue-soft),var(--green-soft))}
.ld-top img{width:100%;height:100%;object-fit:cover;display:block}
.ld-top .ic-tile{background:#fff;color:var(--blue);box-shadow:0 12px 26px -12px rgba(74,66,62,.5)}
.ld-body{padding:1.15rem 1.3rem 1.35rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.ld-body h3{font-size:1.02rem;line-height:1.3}
.ld-body p{font-size:.88rem;color:var(--muted)}

/* ---- topic card ---- */
.topiccard{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);
  overflow:hidden;cursor:pointer;box-shadow:var(--shadow-card);transition:transform .18s,box-shadow .2s,border-color .15s}
.topiccard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:var(--blue)}
.tp-cover{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg-soft);
  border-bottom:1px solid var(--line);flex:none}
.tp-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s ease}
.topiccard:hover .tp-cover img{transform:scale(1.045)}
.tp-top{display:flex;align-items:flex-start;gap:.75rem;padding:1.05rem 1.25rem .35rem}
.tp-top h3{font-size:1rem;line-height:1.35;flex:1}
.tp-body{padding:.35rem 1.25rem 1.25rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.tp-body p{font-size:.87rem;color:var(--muted)}
.tp-count{font-family:var(--mono);font-size:.7rem;font-weight:700;color:var(--faint);letter-spacing:.05em}
.tp-admin{display:flex;gap:.5rem;padding:0 1.25rem 1.15rem}

/* ---- curriculum / two-pane ---- */
.twopane{display:grid;grid-template-columns:19rem 1fr;gap:2rem;align-items:start}
@media(max-width:980px){.twopane{grid-template-columns:1fr}}
.pane-side{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-card);padding:1.1rem;
  position:sticky;top:5.5rem;max-height:calc(100vh - 7rem);overflow-y:auto;scrollbar-width:thin}
.pane-side::-webkit-scrollbar{width:8px}
.pane-side::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:999px;border:2px solid #fff}
@media(max-width:980px){.pane-side{position:static;max-height:none}}
.renamable{cursor:text}
.renaming{outline:2px solid var(--blue);outline-offset:2px;background:#fff;color:var(--ink);
  border-radius:.15rem;cursor:text}
.unit.active .u-nm.renaming{color:var(--ink)}
.pane-add{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line)}
.pane-add label{display:block;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted-2);margin-bottom:.3rem}
.pane-empty{display:flex;align-items:flex-start;gap:.5rem;font-size:.85rem;color:var(--muted);line-height:1.55;
  background:var(--bg-soft);border:1px dashed var(--line-2);padding:.85rem .9rem}
.pane-empty i,.pane-empty svg.lucide{width:1rem;height:1rem;flex:none;margin-top:.1rem;color:var(--faint)}
.emptypane{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-card);
  padding:4rem 2rem;text-align:center}
.emptypane .ic-tile{margin:0 auto 1.25rem}
.emptypane h3{font-size:1.25rem;margin-bottom:.6rem}
.emptypane p{color:var(--muted);line-height:1.7;max-width:32rem;margin:0 auto}

/* the course index: a row of numbers per topic, the topic named on the right */
.cidx{--cell:2.9rem;--cw:3.6rem;display:grid;gap:.85rem;overflow-x:auto;padding:1rem 0 .4rem}
.cidx-row{display:grid;grid-template-columns:minmax(10rem,14rem) max-content;gap:1.75rem;align-items:center}
.cidx-head{padding-bottom:.6rem;border-bottom:1px solid var(--line);margin-bottom:.15rem}
.cidx-hh{font-size:.66rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.cidx-hh.lbl{padding-left:calc(.7rem + 3px)}
.cidx-cells{display:grid;grid-template-columns:repeat(var(--n,1),var(--cw));gap:4px}
.cidx-gap{height:var(--cell);background:var(--bg-soft)}
.cidx-cell{position:relative;display:grid;place-items:center;height:var(--cell);
  border:1px solid rgba(59,53,49,.12);background:var(--ct,var(--green));color:var(--ci,#fff);
  font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.03em;
  padding:0 .2rem;text-align:center;cursor:pointer;transition:filter .12s}
.cidx-cell:hover{filter:brightness(.95);outline:2px solid var(--ink-3);outline-offset:-2px}
.cidx-h{border-left:3px solid var(--ck,var(--line-2));padding:.15rem 0 .15rem .7rem;
  font-size:.76rem;font-weight:800;line-height:1.4;color:var(--ink)}
.cidx-h b{display:block;font-family:var(--mono);font-size:.64rem;font-weight:700;letter-spacing:.1em;
  color:var(--ck,var(--muted-2));margin-bottom:.25rem}
/* the course outline page */
.outlinepanel{padding:1.5rem 1.75rem 1.75rem}
.outline-h h2{font-size:1.15rem;letter-spacing:-.01em;margin:0}
.outline-h p{margin:.35rem 0 0;font-size:.9rem;color:var(--muted)}
/* the hover label naming the subtopic behind a number */
.cidx-tip{position:fixed;z-index:60;max-width:15rem;background:var(--ink-3);color:#fff;
  padding:.4rem .55rem;font-size:.76rem;font-weight:600;line-height:1.4;pointer-events:none}
.cidx-tip b{display:block;font-family:var(--mono);font-size:.68rem;font-weight:700;color:#e8dcc9}

.pane-h{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 .7rem}
/* one card per topic: its heading and, when open, its subtopics */
.modgrp{background:#fff;border:1px solid var(--line);border-left:3px solid var(--line-2);
  margin-bottom:.5rem;transition:border-color .15s}
.modgrp.open{border-left-color:var(--green)}
.modgrp:hover{border-color:var(--line-2)}
.modgrp:hover.open{border-left-color:var(--green)}
.modhead{display:flex;align-items:center;gap:.55rem;font-size:.78rem;font-weight:800;color:var(--ink);
  background:none;border:0;padding:.6rem .7rem;cursor:pointer;transition:background .15s}
.modhead:hover{background:var(--bg-soft)}
.units{border-top:1px solid var(--line);padding:.2rem 0}
.mh-cv{display:grid;place-items:center;flex:none;color:var(--faint);transition:transform .15s}
.mh-cv i,.mh-cv svg.lucide{width:.9rem;height:.9rem}
.modhead.shut .mh-cv{transform:rotate(-90deg)}
.mh-t{flex:1;min-width:0;line-height:1.4}
.mh-n{flex:none;font-family:var(--mono);font-size:.66rem;font-weight:700;color:var(--muted-2);
  background:var(--chip);padding:.1rem .4rem}
.unit{display:flex;align-items:flex-start;gap:.5rem;padding:.42rem .7rem;cursor:pointer;
  transition:background .15s}
.unit:hover{background:var(--bg-soft)}
.unit.active{background:var(--blue);box-shadow:none}
.unit.active:hover{background:var(--blue)}
.unit.active .u-nm,.unit.active .u-code,.unit.active .u-sub{color:#fff}
.unit.active .u-code{color:rgba(255,255,255,.72)}
.u-code{font-family:var(--mono);font-size:.68rem;font-weight:700;color:var(--faint);flex:none;padding-top:.12rem;min-width:1.9rem}
.u-nm{font-size:.84rem;font-weight:600;color:var(--ink);line-height:1.45;flex:1}
.u-sub{font-size:.72rem;color:var(--muted-2);margin-top:.1rem}
.u-del{flex:none;border:0;background:none;color:rgba(255,255,255,.7);padding:0 .2rem;font-size:.8rem}
.unit:not(.active) .u-del{color:var(--faint)}
.u-del:hover{color:var(--red)}

/* ---- resource list row (list view) ---- */
.listwrap{display:grid}
.listcard{display:flex;align-items:center;gap:1.15rem;background:#fff;border:1px solid var(--line-2);
  padding:1.15rem 1.25rem;cursor:pointer;transition:border-color .15s,background .15s}
.listcard + .listcard{margin-top:-1px}
.listcard:hover{border-color:var(--green);background:var(--bg-soft);z-index:1;position:relative}
.lc-fi{width:2.6rem;height:2.6rem;flex:none;align-self:flex-start;margin-top:.15rem}
.listcard h4{font-size:1rem;margin:0;line-height:1.35}
.listcard:hover h4{color:var(--green-d)}
.listcard .purpose{font-size:.88rem;color:var(--muted);margin-top:.2rem;line-height:1.55}
.lc-main{flex:1;min-width:0}
.lc-head{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
.lc-kind{font-size:.76rem;font-weight:700;color:var(--faint);white-space:nowrap}
.lc-foot{display:flex;align-items:center;gap:.5rem .9rem;flex-wrap:wrap;margin-top:.7rem}
.lc-foot .tags{gap:.35rem;margin:0}
/* the contributor follows the tags on the same line, separated by a hairline rule */
.lc-by{display:inline-flex;align-items:center;gap:.45rem;font-size:.78rem;color:var(--muted-2);
  white-space:nowrap;padding-left:.9rem;border-left:1px solid var(--line-2)}
.lc-by .pw-av.sm{width:1.5rem;height:1.5rem;font-size:.58rem}
.lc-act{display:flex;align-items:center;gap:.5rem;flex:none}
@media(max-width:700px){.listcard{flex-wrap:wrap}.lc-act{width:100%;justify-content:flex-end}}

/* ---- applied-filter chips ---- */
.applied{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:0 0 1.15rem}
.applied .lb{font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.fchip{display:inline-flex;align-items:center;gap:.4rem;background:var(--blue-soft);border:1px solid #cfe0d4;
  color:var(--blue);border-radius:999px;padding:.28rem .4rem .28rem .8rem;font-size:.8rem;font-weight:700}
.fchip button{border:0;background:none;padding:0;display:grid;place-items:center;width:1.05rem;height:1.05rem;
  border-radius:50%;color:var(--blue)}
.fchip button:hover{background:rgba(78,124,89,.14)}
.fchip i,.fchip svg.lucide{width:.75rem;height:.75rem}
.clearall{border:0;background:none;padding:0;font:inherit;font-size:.8rem;font-weight:700;color:var(--muted-2);
  text-decoration:underline;text-underline-offset:3px}
.clearall:hover{color:var(--red)}

/* ---- segmented view toggle ---- */
.seg{display:inline-flex;background:var(--bg-soft);border:1px solid var(--line);padding:.2rem;gap:.15rem}
.seg button{border:0;background:none;padding:.4rem .8rem;font:inherit;font-size:.8rem;font-weight:700;
  color:var(--muted-2);display:inline-flex;align-items:center;gap:.4rem;transition:.15s}
.seg button i,.seg button svg.lucide{width:.9rem;height:.9rem}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(74,66,62,.14)}

/* ---- file card (course topic / subtopic files) ---- */
.filecard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);overflow:hidden;
  box-shadow:var(--shadow-card);transition:.2s;position:relative}
.filecard:hover{box-shadow:var(--shadow-lift);border-color:var(--line-2);transform:translateY(-2px)}
.fc-prev{aspect-ratio:16/9;display:grid;place-items:center;background:var(--bg-soft);border-bottom:1px solid var(--line);
  cursor:pointer;overflow:hidden}
.fc-prev .ic-tile{background:#fff;border:1px solid var(--line-2)}
.fc-body{padding:.9rem 1rem 1.05rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.fc-body h4{font-size:.92rem;line-height:1.4}
.fc-x{position:absolute;top:.5rem;right:.5rem;z-index:3;width:1.8rem;height:1.8rem;border:1px solid var(--line-2);
  background:#fff;color:var(--muted);display:grid;place-items:center}
.fc-x:hover{background:var(--red);color:#fff;border-color:var(--red)}
.fc-x i,.fc-x svg.lucide{width:.85rem;height:.85rem}

/* ---- metadata tags ---- */
.mtag{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .75rem;border-radius:999px;
  font-size:.79rem;font-weight:600;line-height:1.35;white-space:nowrap;
  background:var(--chip);color:var(--muted);border:1px solid var(--line)}
.mtag i,.mtag svg.lucide{width:.85rem;height:.85rem;opacity:.75}
/* a resource system or theme — tinted to its own colour */
.mtag.sys{background:var(--st-s);color:var(--st);border-color:color-mix(in srgb,var(--st) 24%,transparent);font-weight:700}
.mtag .mdot{width:.45rem;height:.45rem;border-radius:50%;background:var(--st);flex:none;opacity:1}
/* what kind of thing it is */
.mtag.kind{background:var(--blue-soft);color:var(--blue);border-color:#cfe0d4;font-weight:700}
/* language */
.mtag.lang{background:#fff;color:var(--muted)}

/* ---- artwork with its explanation beside it ---- */
.artrow{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:stretch;
  background:var(--card);border:1px solid var(--line);box-shadow:none;overflow:hidden}
.artrow .cfig{background:#fff;display:grid;place-items:center}
.artrow .arttext{padding:2.5rem;display:flex;flex-direction:column;justify-content:center}
.artrow.flip .cfig{order:2}
/* a wide piece of artwork takes the whole row, with its text beneath at a
   readable measure — squeezed into a column its captions cannot be read */
.artrow.wide{grid-template-columns:1fr;gap:0;justify-items:stretch}
.artrow.wide .cfig{width:100%}
.artrow.wide .arttext{max-width:56rem;text-align:center}
.artrow.wide .arttext p{margin-left:auto;margin-right:auto}
/* text that introduces the artwork below it */
.artrow.wide .arttext.lead-in{margin-bottom:.25rem}
.artrow.wide .cfig img{margin-left:auto;margin-right:auto}
@media(max-width:900px){.artrow{grid-template-columns:1fr;gap:0}.artrow.flip .cfig{order:0}}
.cfig{margin:0}
.cfig img{width:100%;height:auto;max-height:70vh;object-fit:contain;display:block}
.cfig[onclick]{cursor:zoom-in}
.cfig .ph.awaiting{position:static;min-height:19rem;border:1.5px dashed var(--line-2);gap:.75rem}
.cfig .ph.awaiting b{font-size:1rem}
.arttext h2{font-size:1.5rem;line-height:1.25;margin-bottom:1rem}
.arttext p{font-size:1rem;line-height:1.75;color:var(--muted)}
.arttext p+p{margin-top:.9rem}

/* ---- capacity building beyond training ---- */
.ldfig{margin:0;display:grid;grid-template-columns:1.3fr .95fr .72fr;gap:1.5rem;align-items:stretch}
@media(max-width:1080px){.ldfig{grid-template-columns:1fr 1fr}.ldfig-end{grid-column:1/-1}}
@media(max-width:760px){.ldfig{grid-template-columns:1fr}}

/* the matrix and its axes */
.ldfig-matrix{position:relative;display:grid;
  grid-template-columns:1.35rem 1.8rem 1fr;grid-template-rows:1fr 1.6rem 1.35rem;gap:.3rem}
.ldm-yaxis{grid-column:1;grid-row:1;writing-mode:vertical-rl;transform:rotate(180deg);place-self:center;
  font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.ldm-yhi,.ldm-ylo{grid-column:2;grid-row:1;justify-self:center;font-size:.68rem;font-weight:800;color:var(--muted-2)}
.ldm-yhi{align-self:start}.ldm-ylo{align-self:end}
.ldm-grid{position:relative;grid-column:3;grid-row:1;display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:.7rem}
.ldm-xaxis{grid-column:3;grid-row:3;justify-self:center;font-size:.7rem;font-weight:800;
  letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.ldm-xhi,.ldm-xlo{grid-column:3;grid-row:2;font-size:.68rem;font-weight:800;color:var(--muted-2)}
.ldm-xhi{justify-self:start}.ldm-xlo{justify-self:end}

.ldm-cell{position:relative;display:flex;flex-direction:column;gap:.3rem;justify-content:center;
  min-height:9rem;padding:1.1rem;border:1px solid var(--line);border-radius:.55rem;background:var(--bg-soft)}
.ldm-cell b{font-size:1.02rem;font-weight:800;color:var(--ink);line-height:1.3}
.ldm-q{font-size:.85rem;font-weight:700;color:var(--muted-2);line-height:1.35}
.ldm-note{font-size:.76rem;color:var(--faint);line-height:1.45}
/* the two that are not the point recede */
.ldm-cell.faint{background:#fdfbf7;border-style:dashed;opacity:.75}
.ldm-cell:first-child{background:#fdfbf7}
.ldm-badge{display:inline-flex;align-items:center;gap:.35rem;align-self:flex-start;margin-bottom:.2rem;
  font-size:.64rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:.26rem .6rem;border-radius:999px;background:var(--green);color:#fff}
.ldm-badge.old{background:#fff;color:var(--muted-2);border:1px solid var(--line-2)}
.ldm-badge i,.ldm-badge svg.lucide{width:.72rem;height:.72rem}
/* where you are, and where you are heading */
.ldm-cell.old{background:#fff;border:1.5px dashed var(--line-2)}
.ldm-cell.target{background:linear-gradient(150deg,#fff,var(--green-soft));
  border:1.5px solid var(--green);box-shadow:0 0 0 4px rgba(78,124,89,.10),0 18px 34px -22px rgba(46,133,64,.6)}
.ldm-cell.target b{color:var(--green-d)}
.ldm-cell.target .ldm-note{color:var(--muted)}
/* the shift itself, sitting in the gutter where it covers nothing */
.ldm-shift{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none}
.ldm-shift-in{display:inline-flex;align-items:center;gap:.4rem;background:var(--green);color:#fff;
  padding:.4rem .75rem;border-radius:999px;font-size:.68rem;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;white-space:nowrap;
  box-shadow:0 0 0 5px #fff,0 10px 22px -10px rgba(46,133,64,.85)}
.ldm-shift-in i,.ldm-shift-in svg.lucide{width:.9rem;height:.9rem}

/* what the shift buys */
.ldfig-gains{display:flex;flex-direction:column;gap:.7rem}
.ldfig-h{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.ldgain{display:flex;align-items:flex-start;gap:.9rem;padding:1rem 1.1rem;border:1px solid var(--line);
  border-radius:.55rem;background:var(--card);flex:1}
.ldgain b{display:block;font-size:.97rem;color:var(--ink)}
.ldgain span{display:block;font-size:.84rem;color:var(--muted);line-height:1.55;margin-top:.2rem}
.ldgain .ic-tile{width:2.4rem;height:2.4rem;border-radius:.6rem}
.ldgain.green{background:var(--green-soft);border-color:var(--green-line)}
.ldgain.blue{background:var(--blue-soft);border-color:#cfe0d4}
.ldgain.amber{background:var(--amber-soft);border-color:var(--amber-line)}

/* the conclusion */
.ldfig-end{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;gap:1.15rem;padding:2rem 1.5rem;border-radius:.55rem;color:#fff;
  background:var(--green)}
.ldfig-end::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1px);background-size:20px 20px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 72%);
  mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 72%)}
.ldfig-end>*{position:relative;z-index:1}
.ldfig-end .ic-tile{width:3.4rem;height:3.4rem;border-radius:50%;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);color:#fff;
  box-shadow:0 0 0 8px rgba(255,255,255,.05)}
.ldfig-end .ic-tile i,.ldfig-end .ic-tile svg.lucide{width:1.6rem;height:1.6rem}
.ldfig-rule{width:2.2rem;height:2px;background:rgba(255,255,255,.32);border-radius:2px}
.ldfig-end p{font-size:1.02rem;line-height:1.65;font-weight:600;color:rgba(255,255,255,.94)}
.ldfig-end em{font-style:normal;color:#a8cbb0}

/* ---- submissions and review ---- */
/* --- My Contributions: filter bar, file card footer, submission detail --- */
.sub-foot{display:flex;flex-direction:column;align-items:flex-start;gap:.45rem;
  padding:.8rem 1rem;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted);margin-top:auto}

.sd-facts{display:flex;flex-direction:column;align-items:flex-start;gap:.55rem;margin-top:.9rem;
  font-size:.8rem;color:var(--muted);line-height:1.5}
.crumb-act .iconbtn,.sd-side-h .iconbtn,.sd-pv-h .iconbtn{width:2.2rem;height:2.2rem;display:grid;place-items:center;
  background:#fff;border:1px solid var(--line-2);color:var(--muted);cursor:pointer;transition:.15s}
.crumb-act .iconbtn:hover,.sd-side-h .iconbtn:hover,.sd-pv-h .iconbtn:hover{border-color:var(--blue);color:var(--blue)}
.crumb-act .iconbtn.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-soft)}

.sd-fb{display:flex;align-items:flex-start;gap:.9rem;padding:1.1rem 1.25rem;margin-bottom:1.5rem;
  background:var(--blue-soft);border:1px solid #cfe0d4;border-left:4px solid var(--blue)}
.sd-fb.rejected{background:var(--red-soft);border-color:#e8c4b6;border-left-color:var(--red)}
.sd-fb-ic{flex:none;color:var(--blue);display:grid;place-items:center;margin-top:.1rem}
.sd-fb.rejected .sd-fb-ic{color:var(--red)}
.sd-fb b{display:block;font-size:.92rem;color:var(--ink);margin-bottom:.25rem}
.sd-fb p{font-size:.88rem;line-height:1.6;color:var(--ink-2)}
.sd-fb .btn{align-self:center}

.sd-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:1.5rem;align-items:stretch}
@media(max-width:1000px){.sd-grid{grid-template-columns:1fr}}
.sd-pv{background:#fff;border:1px solid var(--line-2);overflow:hidden;
  display:flex;flex-direction:column}
.sd-pv-h{display:flex;align-items:center;gap:.5rem;padding:.85rem 1.25rem;border-bottom:1px solid var(--line);
  font-size:.85rem;font-weight:800;color:var(--ink)}
.sd-pv-h i,.sd-pv-h svg.lucide{width:.95rem;height:.95rem;color:var(--muted)}
.sd-pv-h .iconbtn{margin-left:auto}
.sd-pv-b{background:var(--card);padding:2.25rem 2rem;display:grid;place-items:center;flex:1;min-height:22rem}
.sd-paper{height:100%;max-height:34rem;width:auto;aspect-ratio:1/1.3;max-width:100%;background:#fff;border:1px solid var(--line-2);
  box-shadow:0 10px 30px rgba(74,66,62,.10);overflow:hidden;position:relative}
.sd-paper>*{width:100%;height:100%}
.sd-paper .pv-page{padding:1.6rem 1.5rem;gap:.6rem}

.sd-side{background:#fff;border:1px solid var(--line-2);padding:1.45rem 1.5rem}
.sd-side-h{padding-bottom:1.15rem;margin-bottom:1.25rem;border-bottom:1px solid var(--line)}
.sd-side-h h3{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted-2);margin-bottom:.9rem}
.sd-id{display:flex;align-items:flex-start;gap:.9rem}
.sd-id-tx{flex:1;min-width:0}
.sd-id-tx b{display:block;font-size:1.05rem;line-height:1.35;color:var(--ink)}
.sd-id-tx p{font-size:.86rem;line-height:1.55;color:var(--muted);margin-top:.35rem}
.sd-id .iconbtn{flex:none}
.sd-grp{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);
  margin:1.3rem 0 .8rem}
.sd-grp:first-of-type{margin-top:0}
.sd-grp{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);
  margin:1.5rem 0 .9rem}
.sd-grp:first-of-type{margin-top:0}
.sd-rows{display:grid;gap:1.05rem}
.sd-row{min-width:0}
.sd-row.wide{grid-column:1/-1}
.sd-k{display:block;font-size:.67rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted-2);margin-bottom:.3rem}
.sd-v{font-size:.88rem;font-weight:600;color:var(--ink);line-height:1.45}
.sd-v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg-soft);
  border:1px solid var(--line);padding:.1rem .4rem;font-size:.78rem;display:inline-block}
.sd-who{display:flex;align-items:center;gap:.6rem}
.sd-who .pw-av{width:2rem;height:2rem;font-size:.7rem;flex:none}
.sd-who b{display:block;font-size:.86rem;color:var(--ink)}
.sd-who span{font-size:.76rem;color:var(--muted)}
.sd-hist{background:#fff;border:1px solid var(--line-2);margin-top:1.5rem}
.sd-hist-h{display:flex;align-items:center;gap:.5rem;padding:1.15rem 1.5rem;border-bottom:1px solid var(--line);
  font-size:1.05rem;font-weight:800;color:var(--ink)}
.sd-hist-h i,.sd-hist-h svg.lucide{width:1rem;height:1rem;color:var(--muted)}
.sd-hist-b{padding:1.5rem 1.6rem 1.75rem}

/* segmented pills — the selected one is green */
/* the same pill filter the contributions list uses */
.seg-tabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.5rem;background:none;border:0;padding:0}
.seg-tab{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:.4rem .85rem;
  font:inherit;font-size:.82rem;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s;
  display:inline-flex;align-items:center;gap:.45rem}
.seg-tab:hover{border-color:var(--green);color:var(--green-d)}
.seg-tab.on{background:var(--green);color:#fff;border-color:var(--green)}
.seg-tab.on:hover{background:var(--green-d);border-color:var(--green-d);color:#fff}

/* the workflow trail — one marker per step, joined by a continuous line */
.tl-flow{list-style:none;display:grid;padding:.25rem 0}
.tl-step{display:flex;align-items:center;gap:1rem;padding:.9rem 0;position:relative;min-width:0}
.tl-step:not(:last-child):before{content:"";position:absolute;left:1.15rem;top:3.1rem;bottom:-.35rem;
  width:2px;background:var(--line-2)}
.tl-dot{width:2.3rem;height:2.3rem;flex:none;border-radius:999px;display:grid;place-items:center;
  background:#fff;border:2px solid var(--line-2);color:var(--muted-2);position:relative;z-index:1}
.tl-dot i,.tl-dot svg.lucide{width:.95rem;height:.95rem}
.tl-dot.now{border-style:dashed;border-color:var(--amber-line);color:var(--amber-d);background:var(--amber-soft)}
.tl-dot.done{background:var(--green);border-color:var(--green);color:#fff}
.tl-dot.changes{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber-d)}
.tl-dot.stop{background:var(--red-soft);border-color:#f2c2ce;color:var(--red)}
.tl-body{flex:1;min-width:0}
.tl-t{font-size:.95rem;color:var(--muted);line-height:1.5}
.tl-t b{color:var(--ink);font-weight:800}
.tl-meta{margin-left:auto;padding-left:1rem;font-size:.82rem;color:var(--muted-2);flex:none;
  font-variant-numeric:tabular-nums}
.tl-meta.live{background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--amber-d);
  font-weight:800;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;padding:.2rem .55rem}

/* the comment thread */
.cm-box{display:flex;gap:.9rem;background:var(--bg-soft);border:1px solid var(--line-2);padding:1.25rem}
.cm-grow{flex:1;min-width:0}
/* the composer sits outside .field, so it needs the field styling of its own */
.cm-box textarea{width:100%;min-height:5.5rem;resize:vertical;padding:.75rem .95rem;
  border:1px solid var(--line-2);border-radius:0;background:#fff;color:var(--ink);
  font:inherit;font-size:.92rem;line-height:1.6;outline:none;transition:.15s}
.cm-box textarea::placeholder{color:var(--faint)}
.cm-box textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(78,124,89,.12)}
.cm-list{margin-top:1.25rem}
.cm-item{display:flex;gap:.9rem;padding:1.15rem .25rem;border-bottom:1px solid var(--line)}
.cm-item:last-child{border-bottom:0;padding-bottom:.25rem}
.cm-h{font-size:.83rem;color:var(--muted);margin-bottom:.3rem}
.cm-h b{color:var(--ink);font-weight:800}
.cm-t{font-size:.9rem;line-height:1.65;color:var(--ink-2)}

/* version history — the release and what changed in it */
.vl{list-style:none;display:grid}
.vl-row{display:flex;align-items:center;gap:1rem;padding:.95rem .25rem;border-top:1px solid var(--line)}
.vl-row:first-child{border-top:0}
.vl-v{flex:none;min-width:3.4rem;text-align:center;font-family:var(--mono);font-size:.78rem;font-weight:700;
  color:var(--ink);background:var(--chip);border:1px solid var(--line-2);padding:.28rem .5rem}
.vl-row.now .vl-v{background:var(--green-soft);border-color:var(--green-line);color:var(--green-d)}
.vl-tx{flex:1;min-width:0}
.vl-t{font-size:.92rem;color:var(--ink);display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.vl-tag{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:var(--green);color:#fff;padding:.12rem .42rem}
.vl-s{font-size:.82rem;color:var(--muted);margin-top:.2rem}
.vl-when{flex:none;font-size:.82rem;color:var(--muted-2);font-variant-numeric:tabular-nums}

/* activity log — one line per event, time to the right */
.al{list-style:none;display:grid}
.al-row{display:flex;align-items:center;gap:.9rem;padding:.9rem .25rem;border-top:1px solid var(--line)}
.al-row:first-child{border-top:0}
.al-ic{flex:none;width:1.9rem;height:1.9rem;display:grid;place-items:center;border-radius:999px;
  background:var(--bg-soft);border:1px solid var(--line-2);color:var(--muted-2)}
.al-ic i,.al-ic svg.lucide{width:.85rem;height:.85rem}
.al-t{flex:1;min-width:0;font-size:.92rem;color:var(--muted);line-height:1.5}
.al-t b{color:var(--ink);font-weight:800}
.al-when{flex:none;text-align:right;font-size:.82rem;color:var(--muted-2);font-variant-numeric:tabular-nums}
.al-when i{display:block;font-style:normal;font-size:.76rem;color:var(--faint);margin-top:.1rem}

/* the comment thread */
.cm-box{display:flex;gap:.9rem;background:var(--bg-soft);border:1px solid var(--line-2);padding:1.25rem}
.cm-grow{flex:1;min-width:0}
/* the composer sits outside .field, so it needs the field styling of its own */
.cm-box textarea{width:100%;min-height:5.5rem;resize:vertical;padding:.75rem .95rem;
  border:1px solid var(--line-2);border-radius:0;background:#fff;color:var(--ink);
  font:inherit;font-size:.92rem;line-height:1.6;outline:none;transition:.15s}
.cm-box textarea::placeholder{color:var(--faint)}
.cm-box textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(78,124,89,.12)}
.cm-list{margin-top:1.25rem}
.cm-item{display:flex;gap:.9rem;padding:1.15rem .25rem;border-bottom:1px solid var(--line)}
.cm-item:last-child{border-bottom:0;padding-bottom:.25rem}
.cm-h{font-size:.83rem;color:var(--muted);margin-bottom:.3rem}
.cm-h b{color:var(--ink);font-weight:800}
.cm-t{font-size:.9rem;line-height:1.65;color:var(--ink-2)}

/* the plainer version and activity lists */
.tl-list{list-style:none;display:grid}
.tl-item{display:flex;gap:.8rem;align-items:flex-start;padding:.15rem 0 1.1rem}
.tl-item:last-child{padding-bottom:0}
.tl-list.rules .tl-item{padding:1.05rem 0;border-top:1px solid var(--line)}
.tl-list.rules .tl-item:first-child{border-top:0;padding-top:.15rem}
.tl-bullet{width:.6rem;height:.6rem;border-radius:999px;background:var(--blue);flex:none;margin-top:.42rem}
.tl-s{font-size:.83rem;color:var(--muted);margin-top:.25rem}
/* --- Approvals table --- */
/* the count reads as a quiet number, not a chip */
.seg-tabs .cnt{margin-left:0;background:none;border:0;padding:0;
  font-size:.8rem;font-weight:800;color:var(--faint);font-variant-numeric:tabular-nums}
.seg-tab:hover .cnt{color:var(--muted-2)}
.seg-tab.on .cnt{color:rgba(255,255,255,.72)}
.ap-panel{background:#fff;border:1px solid var(--line-2);overflow-x:auto}
.ap-table{width:100%;border-collapse:collapse;min-width:52rem}
.ap-table th{text-align:left;font-size:.82rem;font-weight:800;color:var(--ink);
  padding:1.05rem 1rem;border-bottom:1px solid var(--line);white-space:nowrap}
.ap-table th:first-child,.ap-table td:first-child{padding-left:1.5rem}
.ap-table th:last-child,.ap-table td:last-child{padding-right:1.5rem}
.ap-table td{padding:.9rem 1rem;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.9rem}
.ap-table tbody tr:last-child td{border-bottom:0}
.ap-table tbody tr:hover,.ap-table tbody tr.menu-open{background:var(--card)}
.ap-name{display:flex;align-items:center;gap:.85rem;min-width:0}
.ap-name .doc-fi{width:2.5rem;height:2.5rem;flex:none}
.ap-name .doc-fi i,.ap-name .doc-fi svg.lucide{width:1.1rem;height:1.1rem}
.ap-name a{font-weight:800;color:var(--ink);cursor:pointer;transition:color .15s}
.ap-name a:hover{color:var(--blue)}
.ap-owner{display:flex;align-items:center;gap:.6rem;white-space:nowrap;font-weight:600;color:var(--ink)}
.ap-dim{color:var(--muted);white-space:nowrap}
.ap-menu-cell{width:1%;text-align:right}
.rowmenu{position:relative;display:inline-block}
/* the kebab only shows its outline once you are on the row */
.rowmenu .kebab{width:2.1rem;height:2.1rem;display:grid;place-items:center;background:transparent;
  border:1px solid transparent;color:var(--muted-2);cursor:pointer;transition:.15s}
.ap-table tbody tr:hover .rowmenu .kebab{background:#fff;border-color:var(--line-2);color:var(--muted)}
.rowmenu .kebab:hover,.rowmenu.open .kebab{background:#fff;border-color:var(--blue);color:var(--blue)}
.rowmenu-list{position:absolute;right:0;top:calc(100% + .35rem);background:#fff;border:1px solid var(--line);
  box-shadow:var(--shadow-float);padding:.35rem;display:none;z-index:40;min-width:12.5rem;text-align:left}
.rowmenu.open .rowmenu-list{display:block}
.rowmenu-list button{display:flex;align-items:center;gap:.7rem;width:100%;border:0;background:none;
  padding:.6rem .75rem;font:inherit;font-size:.88rem;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.rowmenu-list button:hover{background:var(--bg-soft);color:var(--blue)}
.rowmenu-list button i,.rowmenu-list button svg.lucide{width:1rem;height:1rem;color:var(--muted)}
.rowmenu-list button:hover i,.rowmenu-list button:hover svg.lucide{color:var(--blue)}
.rowmenu-list button.danger:hover{color:var(--red)}
.rowmenu-list button.danger:hover i,.rowmenu-list button.danger:hover svg.lucide{color:var(--red)}

/* --- the review dialogs --- */
.rd-head{display:flex;align-items:flex-start;gap:1rem;padding:1.6rem 1.6rem 1.25rem}
.rd-head h3{font-size:1.2rem;line-height:1.3}
.rd-head p{font-size:.88rem;color:var(--muted);margin-top:.3rem;line-height:1.55}
.rd-head > div{flex:1;min-width:0}
.rd-ic{width:2.9rem;height:2.9rem;flex:none;display:grid;place-items:center}
.rd-ic i,.rd-ic svg.lucide{width:1.3rem;height:1.3rem}
.rd-ic.warn{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
.rd-ic.stop{background:var(--red-soft);color:var(--red);border:1px solid #e8c4b6}
.rd-ic.go{background:var(--green-soft);color:var(--green-d);border:1px solid var(--green-line)}
.rd-body{padding:0 1.6rem 1.5rem}
.rd-body textarea{min-height:7rem}
.rd-foot{display:flex;justify-content:flex-end;gap:.6rem;padding:1.15rem 1.6rem;
  background:var(--bg-soft);border-top:1px solid var(--line)}
#pn-reason{padding:0}

/* the file a review dialog is about */
/* the state list inside the process-documents dialog */
.statelist{display:grid;border:1px solid var(--line-2)}
.state-row{display:flex;align-items:center;gap:.85rem;padding:.8rem .95rem;cursor:pointer;
  border-top:1px solid var(--line);transition:background .15s}
.state-row:first-child{border-top:0}
.state-row:hover{background:var(--green-soft)}
.state-ic{flex:none;width:1.9rem;height:1.9rem;display:grid;place-items:center;
  background:var(--green-soft);color:var(--green-d);transition:.15s}
.state-row:hover .state-ic{background:var(--green);color:#fff}
.state-ic i,.state-ic svg.lucide{width:.9rem;height:.9rem}
.state-tx{flex:1;min-width:0}
.state-tx b{display:block;font-size:.94rem;color:var(--ink);line-height:1.35}
.state-row:hover .state-tx b{color:var(--green-d)}
.state-tx span{display:block;font-size:.78rem;color:var(--muted);margin-top:.1rem}
.state-pdf{flex:none;font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.06em;
  color:var(--muted-2);background:var(--chip);border:1px solid var(--line-2);padding:.12rem .35rem}
.state-go{flex:none;color:var(--faint);transition:color .15s,transform .15s}
.state-go i,.state-go svg.lucide{width:.95rem;height:.95rem}
.state-row:hover .state-go{color:var(--green-d);transform:translateX(3px)}

.ap-file{display:flex;align-items:center;gap:.9rem;background:var(--bg-soft);border:1px solid var(--line);
  padding:1rem 1.1rem;margin-top:.35rem}
.ap-file .doc-fi{width:2.6rem;height:2.6rem;flex:none}
.ap-file .doc-fi i,.ap-file .doc-fi svg.lucide{width:1.15rem;height:1.15rem}
.ap-file > div b{display:block;font-size:.95rem;color:var(--ink);line-height:1.35}
.ap-file > div span{display:block;font-size:.83rem;color:var(--muted);margin-top:.2rem}
.btn-amber{background:var(--amber);border-color:var(--amber);color:#fff}
.btn-amber:hover{background:#9a5c00;border-color:#9a5c00;color:#fff}
.sub-pill{display:inline-flex;align-items:center;gap:.4rem;flex:none;white-space:nowrap;font-size:.74rem;font-weight:800;
  letter-spacing:.05em;text-transform:uppercase;padding:.3rem .7rem;border-radius:999px;border:1px solid}
.sub-pill i,.sub-pill svg.lucide{width:.85rem;height:.85rem}
.sub-pill.pending {background:var(--amber-soft);color:var(--amber-d);border-color:var(--amber-line)}
.sub-pill.changes {background:var(--blue-soft);color:var(--blue);border-color:#cfe0d4}
.sub-pill.approved{background:var(--green-soft);color:var(--green-d);border-color:var(--green-line)}
.sub-pill.rejected{background:var(--red-soft);color:var(--red);border-color:#e8c4b6}
/* the reviewer's note, shown back to the contributor */
/* counts on the nav entries */
.acct-badge{margin-left:auto;font-size:.72rem;font-weight:800;background:var(--amber);color:#fff;
  border-radius:999px;padding:.05rem .45rem}
.acct-item.active .acct-badge{background:#fff;color:var(--blue)}
.pw-badge{font-size:.7rem;font-weight:800;background:var(--amber);color:#fff;border-radius:999px;padding:.05rem .4rem}

/* ---- a note alongside a short card row ---- */
.rownote{position:relative;grid-column:span 2;align-self:stretch;margin:0;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;gap:.9rem;
  background:var(--green);padding:2rem 2.25rem;
  box-shadow:0 18px 38px -24px rgba(46,133,64,.75)}
/* the quote mark sits behind the text as a watermark */
.rq-mark{position:absolute;top:-1.4rem;right:1rem;font-size:9rem;line-height:1;font-weight:800;
  color:rgba(255,255,255,.16);pointer-events:none;user-select:none}
.rownote>*{position:relative;z-index:1}
.rownote p{font-size:1.12rem;line-height:1.65;font-weight:500;color:#fff;letter-spacing:-.01em}
.rq-by{display:flex;align-items:center;gap:.6rem;font-size:.76rem;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;color:rgba(255,255,255,.82)}
.rq-by::before{content:'';width:1.6rem;height:2px;background:rgba(255,255,255,.5);flex:none}
@media(max-width:700px){.rownote{padding:1.6rem 1.5rem}.rownote p{font-size:1rem}}
@media(max-width:980px){.rownote{grid-column:span 2}}
@media(max-width:700px){.rownote{grid-column:span 1}}

/* ---- drag to reorder ---- */
.filewrap{position:relative}
.filewrap.draggable{cursor:grab}
.filewrap.draggable:active{cursor:grabbing}
.filewrap.dragging{opacity:.4}
.filewrap.dragover::after{content:'';position:absolute;inset:-4px;border:2px dashed var(--blue);
  border-radius:.4rem;background:rgba(78,124,89,.05);pointer-events:none;z-index:4}

  width:1.8rem;height:1.8rem;border:1px solid var(--line-2);background:#fff;color:var(--muted-2);
  border-radius:.4rem;cursor:grab;transition:.15s}

.callout .tx .tx-hint{display:inline-flex;align-items:center;gap:.4rem;margin-top:.4rem;
  font-size:.85rem;font-weight:600;color:var(--amber-d)}
.callout .tx .tx-hint i,.callout .tx .tx-hint svg.lucide{width:.9rem;height:.9rem;color:var(--amber)}

/* ---- upload tile (course wizard) ---- */
.uploadtile{border:1.5px dashed var(--line-2);background:var(--bg-soft);padding:1.1rem;display:flex;
  flex-direction:column;align-items:center;gap:.7rem;text-align:center;transition:.15s}

  padding:.5rem .9rem;font-size:.85rem;font-weight:700;color:var(--muted-2);cursor:pointer;transition:.15s}
.wstep .n{display:grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--bg-soft);
  border:1px solid var(--line-2);font-size:.72rem;font-weight:800;color:var(--muted-2)}
.wstep.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.wstep.on .n{background:var(--blue);border-color:var(--blue);color:#fff}
.stickybar{position:sticky;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  gap:1rem;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);
  padding:1rem 1.25rem;box-shadow:0 -12px 32px -20px rgba(74,66,62,.55)}

/* ---- accordion (FAQ) ---- */
.qitem{border-top:1px solid var(--line)}
.qitem:first-child{border-top:0}

  padding:1.05rem 0;font:inherit;font-size:.98rem;font-weight:700;color:var(--ink);text-align:left}

/* ---- misc ---- */
.tag-row{display:flex;flex-wrap:wrap;gap:.4rem}
.hidden{display:none!important}

.pwfield{position:relative;display:flex;align-items:center}
.pweye{position:absolute;right:.75rem;border:0;background:none;font:inherit;font-size:.78rem;font-weight:700;color:var(--blue)}
.gridauto{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:1.35rem}
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:1.25rem}
table.admin{width:100%;border-collapse:collapse;font-size:.88rem}
table.admin th{text-align:left;padding:.75rem 1rem;background:var(--ink);color:#fff;font-size:.76rem;
  font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
table.admin td{padding:.75rem 1rem;border-top:1px solid var(--line);color:var(--ink);vertical-align:top}
table.admin tr:nth-child(even) td{background:var(--bg-soft)}
.scrollx{overflow-x:auto;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-card)}
.imgblock{width:100%;display:block;border:1px solid var(--line);background:var(--card)}
@media(max-width:700px){.twopane{gap:1.25rem}}

/* ---- narrow-viewport safety: grid and flex children must be allowed to shrink ---- */
.grid>*,.docgrid>*,.gridauto>*,.editgrid>*,.ldgrid>*,.typegrid>*{min-width:0}

<script>
/* ============================================================
   ROLES / ACCESS (mock auth — prototype only, no backend)
   visitor (default) · registered · admin
   ============================================================ */
let currentRole = "visitor";
let prevRoute = "#/home";
const ROLE_LABEL = {
  visitor:"Visitor", registered:"Registered User",
  reviewer:"Content Reviewer", admin:"Repository Administrator"
};
const ROLE_INIT  = {visitor:"V", registered:"RU", reviewer:"CR", admin:"RA"};
const ROLE_BLURB = {
  visitor:"Browse, search and download. Cannot upload or modify content.",
  registered:"Upload and submit resources, and track your own submissions.",
  reviewer:"Review submissions, request revisions, approve or decline, and correct metadata.",
  admin:"Full rights — publishing, users and roles, taxonomy, the homepage and settings."
};
function roleLabel(){ return ROLE_LABEL[currentRole]; }
function isAdmin(){ return currentRole==="admin"; }
/* a reviewer decides on submissions and corrects metadata; only an admin
   holds the system rights — users, taxonomy, the homepage, settings */
function isReviewer(){ return currentRole==="reviewer"; }
function canReview(){ return currentRole==="reviewer" || currentRole==="admin"; }
function canEditMeta(){ return canReview(); }
function canManage(){ return currentRole==="admin"; }
function isRegistered(){ return currentRole!=="visitor"; }
function canDownload(){ return currentRole!=="visitor"; }
function saveRole(){ try{ localStorage.setItem("fc_role", currentRole); }catch(e){} }
function loadRole(){ try{ const r=localStorage.getItem("fc_role");
  if(ROLE_LABEL[r]) currentRole=r; }catch(e){} }
function setRole(role, dest){ currentRole=role; saveRole(); toast("Signed in as "+ROLE_LABEL[role]); go(dest||"#/home"); }
function signOut(){ currentRole="visitor"; saveRole(); toast("Signed out"); go("#/home"); }
function download(title){
  if(canDownload()) toast("Download started — "+title);
  else { toast("Sign in to download this resource"); go("#/login"); }
}
function goBack(){
  if(prevRoute && prevRoute!==location.hash) go(prevRoute);
  else if(window.history && history.length>1) history.back();
  else go("#/home");
}

/* ============================================================
   DATA — carried over from the approved wireframe
   ============================================================ */
const STAGES = [
  {id:"understand",   num:"01", name:"Understand Context", icon:"compass",
   short:"Read the local social, ecological and institutional context before acting.",
   what:"Map the resource, the community, existing use patterns, power dynamics and prior institutions."},
  {id:"institutions", num:"02", name:"Build Institutions", icon:"users",
   short:"Form or strengthen a legitimate community institution to govern the commons.",
   what:"Convene the community, define membership, draft collective rules and decision-making norms."},
  {id:"tenure",       num:"03", name:"Secure Tenure", icon:"scale",
   short:"Establish legal recognition and secure rights over the shared resource.",
   what:"Prepare and file claims, gather evidence, engage authorities, obtain recognition of rights."},
  {id:"plan",         num:"04", name:"Plan", icon:"clipboard-list",
   short:"Develop a collective management and restoration plan.",
   what:"Set shared goals, zone the resource, agree priorities, sequence actions and resources."},
  {id:"restore",      num:"05", name:"Restore & Manage", icon:"sprout",
   short:"Carry out restoration and day-to-day sustainable management.",
   what:"Implement restoration works, enforce collective rules, manage use and benefit-sharing."},
  {id:"monitor",      num:"06", name:"Monitor & Adapt", icon:"activity",
   short:"Track outcomes and adapt the approach over time.",
   what:"Measure ecological and institutional health, reflect, and revise rules and plans."}
];
function stageById(id){ return STAGES.find(s=>s.id===id); }

const SYSTEMS = {
  forests:{id:"forests", kind:"system", name:"Forests", icon:"trees", accent:"forests", img:"assets/img/forests.jpg",
    blurb:"Community rights, institutions, collective governance, conservation and sustainable management.",
    desc:"Forest commons are held and used collectively, so the work begins with rights — helping a community understand what the law recognises and prepare the claims that secure it. From there the focus turns to institutions: a Gram Sabha or forest rights committee that can hold decisions, keep records and speak for the village. With rights and governance in place, communities plan how the forest is used and restored — which patches to protect, which to harvest, and how to monitor what changes over the seasons.",
    users:"Facilitators, field practitioners, learners and community institutions working on forest commons.",
    outcome:"Secure community forest rights, functioning institutions, and restored, sustainably managed forests.",
    process:["Understand","Institutions","Tenure","Plan","Restore","Monitor"]},
  pastureland:{id:"pastureland", kind:"system", name:"Pastureland", icon:"wheat", accent:"pastureland", img:"assets/img/pastureland.jpg",
    blurb:"Community institutions, tenure/recognition, collective rules, restoration and sustainable use.",
    desc:"Pasturelands are shared grazing grounds, and they hold up only when a community agrees how to use them. The work starts by mapping who grazes where and what the land can carry, then builds the institution that can hold those decisions and secure recognition of tenure. Once rules on grazing, rotation and fodder are set collectively, the same group plans restoration, tracks how the ground recovers, and adapts the rules as the commons changes.",
    users:"Facilitators, field practitioners, learners and community institutions working on pasturelands.",
    outcome:"Recognised tenure, functioning institutions, and restored, sustainably managed grazing commons.",
    process:["Understand","Institutions","Tenure","Plan","Restore","Monitor"]},
  water:{id:"water", kind:"system", name:"Water", icon:"droplets", accent:"water", img:"assets/img/water.jpg",
    blurb:"Collective institutions, equitable access, planning, management and stewardship.",
    desc:"Water is the commons where a decision upstream is felt downstream, so equitable access is the first question. The work begins by reading the watershed with the community — springs, tanks, recharge and draw — and forming the institution that can hold those decisions across hamlets. From there the group plans allocation and use, maintains the structures it depends on, and monitors the resource so stewardship carries on between seasons.",
    users:"Facilitators, field practitioners, learners and community institutions working on water commons.",
    outcome:"Equitable access, functioning institutions, and sustainably managed and stewarded water systems.",
    process:["Understand","Institutions","Access","Plan","Manage","Monitor"]}
};
const STATES = ["Rajasthan","Andhra Pradesh","Karnataka"];
/* the state and language a topic belongs to — the topic list filters on these */
const TOPIC_STATES = ["All States"].concat(STATES);
/* the topic list filter — radios build a draft, Apply commits it */
let TDRAFT  = {state:"All States", lang:"All Languages"};
let TFILTER = {state:"All States", lang:"All Languages"};
function setTDraft(k,v){ TDRAFT[k]=v; }
function applyTopicFilter(){ TFILTER = Object.assign({}, TDRAFT); render(); }
function resetTopicFilter(){
  TDRAFT  = {state:"All States", lang:"All Languages"};
  TFILTER = Object.assign({}, TDRAFT); render();
}
function topicFilterOn(){ return TFILTER.state!=="All States" || TFILTER.lang!=="All Languages"; }
function topicMatches(t){
  const okS = TFILTER.state==="All States" || t.state===TFILTER.state || t.state==="All States";
  const okL = TFILTER.lang==="All Languages" || t.lang===TFILTER.lang || t.lang==="All Languages";
  return okS && okL;
}
/* every topic carries a state and a language so the filter has something to match */
function seedTopicMeta(){
  TOPICS.forEach((t,i)=>{
    if(!t.state) t.state = STATES[i % STATES.length];
    if(!t.lang)  t.lang  = (i % 3 === 2) ? "Hindi" : "English";
  });
}
const TOPIC_LANGS  = ["All Languages","English","Hindi"];

const THEMES = {
  map:{id:"map", kind:"theme", name:"Multi-Actor Platforms", icon:"network", accent:"map", img:"assets/img/theme-map.jpg",
    desc:"Convening and aligning multiple stakeholders around shared commons goals.",
    users:"Facilitators, partners and institutions coordinating across actors.",
    outcome:"Aligned stakeholders and shared plans that advance commoning."},
  leo:{id:"leo", kind:"theme", name:"Local Economic Opportunities", icon:"hand-coins", accent:"leo", img:"assets/img/theme-leo.jpg",
    desc:"Livelihoods and value from the sustainable use of the commons.",
    users:"Community enterprises, facilitators and livelihood practitioners.",
    outcome:"Sustainable livelihoods anchored in the commons."},
  agri:{id:"agri", kind:"theme", name:"Sustainable Agriculture Practices", icon:"leaf", accent:"agri", img:"assets/img/theme-agri.jpg",
    desc:"Practices that sustain soil, water and productivity over the long term.",
    users:"Farmers, facilitators and field practitioners.",
    outcome:"Practices that sustain soil, water and long-term productivity."}
};
const THEME_LIST = Object.keys(THEMES).map(k=>THEMES[k]);
function entityById(id){ return SYSTEMS[id] || THEMES[id]; }
function accentOf(e){ return e && e.accent ? e.accent : "map"; }
function accentVar(e){ return "--tc:var(--s-"+accentOf(e)+")"; }
/* the accent for a system or theme referred to by name */
const NAME_ACCENT = {"Forests":"forests","Pastureland":"pastureland","Water":"water",
  "Multi-Actor Platforms":"map","Local Economic Opportunities":"leo",
  "Sustainable Agriculture Practices":"agri"};
/* a metadata tag, tinted by what it represents rather than all one grey */
function metaTag(value){
  if(NAME_ACCENT[value])
    return `<span class="mtag sys" style="${systagVars(value)}"><i class="mdot"></i>${value}</span>`;
  if(_fg('type').opts.indexOf(value) >= 0 || /^(PDF|Video|Image|Audio|Document)$/i.test(value))
    return `<span class="mtag kind">${value}</span>`;
  if(_fg('lang').opts.indexOf(value) >= 0)
    return `<span class="mtag lang">${ic('languages')}${value}</span>`;
  return `<span class="mtag">${value}</span>`;
}
function systagVars(name){
  const a = NAME_ACCENT[name];
  return a ? `--st:var(--s-${a});--st-s:var(--s-${a}-s)` : `--st:var(--ink);--st-s:var(--chip)`;
}

/* learning-design groupings */
const LD = [
  {id:"modular",    name:"Modular Learning", icon:"layers", badge:"Modular",
   desc:"Progressive training modules delivered as a series.", img:"assets/img/la-training.jpg"},
  {id:"atomized",   name:"Atomized Course Curriculum (LDHF) & Learning Materials", icon:"zap", badge:"LDHF",
   desc:"Low-dose high-frequency atomised content and learning materials.", img:"assets/img/la-ldhf.jpg"},
  {id:"supporting", name:"Supporting Resources", icon:"book-open", badge:"Support",
   desc:"Handbooks, facilitators' guides, SoPs, formats and tools.", img:"assets/img/commons-restoration.jpg"}
];
function ldById(id){ return LD.find(x=>x.id===id); }

/* 5-step orientation — take a tour */
const JOURNEY5 = [
  {n:"1", k:"ORIENT",     q:"What is this repository?",             d:"Understand what the repository is and what it helps you do.", href:"#/commoning", icon:"compass"},
  {n:"2", k:"UNDERSTAND", q:"What is Commoning?",                   d:"The meaning of Commoning of Commons.", href:"#/commoning", icon:"lightbulb"},
  {n:"3", k:"LEARN",      q:"How does capacity building work?",     d:"How continuous learning supports Commoning — and two methods of doing it.", href:"#/learning-approach", icon:"graduation-cap"},
  {n:"4", k:"CHOOSE",     q:"Pastureland / Forest / Water",         d:"Select the natural-resource system or theme you are working with.", href:"#/resource-systems", icon:"layers"},
  {n:"5", k:"ACT",        q:"Use resources in sequence",            d:"Access resources in a logical sequence to facilitate processes on the ground.", href:"#/library", icon:"library"}
];

/* Commoning in Action — field stories */
const STORIES = [
  {id:"gram-sabha-forest", title:"How a Gram Sabha strengthened governance of its Forest Commons", system:"Forests", sys:"forests", stage:"Build Institutions", img:"assets/img/story-gram-sabha-forest.jpg",
   excerpt:"A village institution took charge of collective decisions and rules for its forest."},
  {id:"pasture-rules", title:"How communities developed rules for managing pasturelands", system:"Pastureland", sys:"pastureland", stage:"Plan", img:"assets/img/story-pasture-rules.jpg",
   excerpt:"Herders agreed shared grazing rules and a seasonal rest cycle for the common pasture."},
  {id:"water-access", title:"How a hamlet secured equitable access to a shared water source", system:"Water", sys:"water", stage:"Secure Tenure", img:"assets/img/story-water-access.jpg",
   excerpt:"Households negotiated fair access and a stewardship rota for the common water system."}
];
function storyById(id){ return STORIES.find(s=>s.id===id); }

/* help topics */
const HELP = [
  {id:"faq",              title:"Frequently Asked Questions",     desc:"Common questions about the repository.",          icon:"circle-help"},
  {id:"how-to-use",       title:"How to use the repository",      desc:"Follow the guided journey or use direct access.", icon:"route"},
  {id:"how-to-find",      title:"How to find a resource",         desc:"Use the Resource Library, search and filters.",   icon:"search"},
  {id:"commoning-stages", title:"Understanding Commoning stages", desc:"The six-stage Commoning pathway explained.",      icon:"milestone"},
  {id:"modular-learning", title:"Understanding Modular Learning", desc:"Progressive modules with field activity.",        icon:"layers"},
  {id:"ldhf",             title:"Understanding LDHF",             desc:"Short, frequent, task-focused learning.",         icon:"zap"}
];
function helpById(id){ return HELP.find(h=>h.id===id); }
const FAQS = [
  ["How do I know which stage I am at?","Use the Commoning pathway on your resource-system page — the active stage is highlighted, and each stage explains what needs to happen."],
  ["Do I have to follow the whole journey?","No. Experienced users can go straight to the Resource Library, search and filter to a specific resource."],
  ["How are resources organised on a resource-system page?","By learning design — Modular Learning, Atomized Course Curriculum (LDHF), and Supporting Resources — with filters for stakeholder, format, language and stage."],
  ["Is the content available in Hindi?","Many resources are available in Hindi and English — filter by Language in the Resource Library."]
];

/* resources — full metadata set from the wireframe */
const RES = [
  {id:"facilitator-guide", title:"Facilitator Guide for Commoning", purpose:"End-to-end guide to facilitate the Commoning process with a community.", system:"All Systems", stage:"All Stages", stake:"Facilitator", design:"Both", type:"Facilitators' Guide", group:"supporting", lang:"English", version:"v1.0 · 2026", attribution:""},

// next numbered code for a module group (e.g. 101,102 -> 103; new group -> N01)
function _nextCode(groups, groupIdx){
  const g = groups[groupIdx];
  const base = (groupIdx+1)*100;
  let max = base;
  g.items.forEach(it=>{ const n=parseInt(it.code,10); if(!isNaN(n)&&n>max) max=n; });
  return String(max+1);
}

function initials(nm){
  const w=(nm||"").trim().split(/\s+/).filter(Boolean);
  if(!w.length) return "";
  return ((w[0][0]||"")+(w.length>1?w[w.length-1][0]:"")).toUpperCase();
}

/* media kind → icon, colour class, label */
function mediaKind(type){
  const t=(type||"").toLowerCase();
  if(t.indexOf("video")>=0) return "video";
  if(t.indexOf("audio")>=0) return "audio";
  if(t.indexOf("image")>=0 || t.indexOf("photo")>=0) return "image";
  if(/pdf|handbook|guide|manual|sop|format|document/.test(t)) return "pdf";
  return "other";
}
const KIND_META = {
  video:{icon:"play",       fi:"fi-vid",   label:"Video"},
  audio:{icon:"audio-lines",fi:"fi-cultural", label:"Audio"},
  image:{icon:"image",      fi:"fi-img",   label:"Image"},
  pdf:{icon:"file-text",    fi:"fi-pdf",   label:"Document"},
  other:{icon:"book-open",  fi:"fi-doc",   label:"Resource"}
};
function kindMeta(type){ return KIND_META[mediaKind(type)] || KIND_META.other; }

  {code:"en", short:"EN", label:"English"},

];
let lang = "en";
function loadLang(){ try{ const v=localStorage.getItem("fc_lang");
  if(LANGS.some(l=>l.code===v)) lang=v; }catch(e){} }
function setLang(code){
  if(!LANGS.some(l=>l.code===code)) return;
  lang = code;
  try{ localStorage.setItem("fc_lang", code); }catch(e){}
  document.documentElement.setAttribute("lang", code);
  langClose();
  toast(tr("lang.switched") + " \u2014 " + LANGS.find(l=>l.code===code).label);
  render();
}

/* six-stage commoning pathway. activeId marks the current stage;
   stages before it read as done. opts.system links into the system. */
function pathway(activeId, opts){
  opts = opts || {};
  const ai = activeId ? STAGES.findIndex(s=>s.id===activeId) : -1;
  const steps = STAGES.map((st,i)=>{
    const cls = st.id===activeId ? "active" : (ai>=0 && i<ai ? "done" : "");
    const ro = opts.static ? "readonly" : "";
    const click = opts.static ? "" : `onclick="go('#/stage/${st.id}${opts.system?('?sys='+opts.system):''}')"`;
    return `<div class="pw-step ${cls} ${ro}" style="--i:${i}" ${click}>
      <span class="pw-num">${st.num}</span>
      <span class="pw-node">${cls==="done"?ic('check'):ic(st.icon)}</span>
      <span class="nm">${st.name}</span>
    </div>`;
  }).join("");
  return `<div class="pathway"${opts.accent?` style="${opts.accent}"`:''}>${steps}</div>`;
}

/* flow diagram — array of [label, caption?] or plain strings; last item is emphasised */
function flow(items, opts){
  opts = opts || {};
  return `<div class="flow">${items.map((it,i)=>{
    const label = Array.isArray(it)?it[0]:it;
    const cap   = Array.isArray(it)?it[1]:"";
    const strong = opts.allStrong || i===items.length-1 ? "strong" : "";
    const arw = i<items.length-1?`<div class="arw">${ic('arrow-right')}</div>`:"";
    return `<div class="node ${strong}"><b>${label}</b>${cap?`<span>${cap}</span>`:''}</div>${arw}`;
  }).join("")}</div>`;
}

/* The library and the search results keep their own view, so switching one

   browsing; search results open as a list, which reads faster when scanning. */
const VIEW = {library:"card", search:"list"};
function loadLibView(){
  try{
    const raw = localStorage.getItem('fc_view');
    if(raw){ const v = JSON.parse(raw);
      ["library","search"].forEach(k=>{ if(v[k]==='card'||v[k]==='list') VIEW[k]=v[k]; }); }
  }catch(e){}
}
function setLibView(ctx, v){
  if(!(ctx in VIEW) || (v!=='card' && v!=='list')) return;
  VIEW[ctx] = v;
  try{ localStorage.setItem('fc_view', JSON.stringify(VIEW)); }catch(e){}
  render();
}
