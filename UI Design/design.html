const FILTER_GROUPS = [
  {key:"system", label:metaLabel("system"), opts:["Pastureland","Forests","Water"], match:(r,v)=> r.system===v || r.system==="All Systems"},
  {key:"stage",  label:metaLabel("stage"), opts:STAGES.map(s=>s.name), match:(r,v)=> r.stage===v},
  {key:"stake",  label:metaLabel("stake"), opts:["Facilitator","Learner","Field Practitioner","Community Member","Mentor"], match:(r,v)=> r.stake===v},
  {key:"design", label:metaLabel("design"), opts:["Modular","LDHF","Both"], match:(r,v)=> r.design===v},
  {key:"type",   label:metaLabel("type"), opts:["Course","Training Module","Atomised Course","Video","Audio","PDF","Handbook","Facilitators' Guide","Format","Tool"], match:(r,v)=> r.type===v},
  {key:"lang",   label:metaLabel("lang"), opts:["English","Hindi"], match:(r,v)=> r.lang===v}
];
/* look a filter group up by key — the forms reuse the filters' option lists */
function _fg(key){ return FILTER_GROUPS.find(g=>g.key===key) || {opts:[]}; }
let FILTERS = {};
function filterActive(){ return FILTER_GROUPS.some(g=>(FILTERS[g.key]||[]).length); }
function filterCount(){ return FILTER_GROUPS.reduce((n,g)=>n+(FILTERS[g.key]||[]).length,0); }
function isFilterOn(key,val){ return (FILTERS[key]||[]).indexOf(val)>=0; }
function toggleFilter(key,val){
  const arr = FILTERS[key] || (FILTERS[key]=[]);
  const i = arr.indexOf(val);
  if(i>=0) arr.splice(i,1); else arr.push(val);
  if(!arr.length) delete FILTERS[key];
  render();
}
function removeFilter(key,val){ const a=FILTERS[key]; if(!a) return; const i=a.indexOf(val);
  if(i>=0) a.splice(i,1); if(!a.length) delete FILTERS[key]; render(); }
function clearAllFilters(){ FILTERS={}; render(); }
function filterByTheme(name){ FILTERS={system:[name]}; go('#/library'); }
function applyFilters(rows){
  return rows.filter(r=>FILTER_GROUPS.every(g=>{
    const sel=FILTERS[g.key]||[]; if(!sel.length) return true;
    return sel.some(v=>g.match(r,v));   /* OR within a group, AND across groups */
  }));
}
function appliedChips(omit){
  const groups = FILTER_GROUPS.filter(g=>!(omit||[]).includes(g.key));
  if(!groups.some(g=>(FILTERS[g.key]||[]).length)) return "";
  let chips="";
  groups.forEach(g=>{ (FILTERS[g.key]||[]).forEach(v=>{
    chips+=`<span class="fchip">${v}<button onclick="removeFilter('${g.key}','${(v+'').replace(/'/g,"\\'")}')" aria-label="Remove ${v}">${ic('x')}</button></span>`;
  });});
  return `<div class="applied"><span class="lb">Filters</span>${chips}
    <button class="clearall" onclick="clearAllFilters()">Clear all</button></div>`;
}
/* `omit` drops groups a page has already fixed — a resource-system page has
   chosen its system, so offering that filter again only invites a dead end. */
function filterSidebar(omit){
  const groups = FILTER_GROUPS.filter(g=>!(omit||[]).includes(g.key));
  const activeHere = groups.some(g=>(FILTERS[g.key]||[]).length);
  const countHere  = groups.reduce((n,g)=>n+(FILTERS[g.key]||[]).length,0);
  return `<aside class="filterbox">
    <div class="fhead"><h2>${ic('sliders-horizontal')} Filters</h2>
      ${activeHere?`<button class="clearbtn" onclick="clearAllFilters()">Clear (${countHere})</button>`:''}</div>
    ${groups.map(g=>`<div class="fgroup"><h3>${g.label}</h3>
      ${g.opts.map(i=>`<label><input type="checkbox" ${isFilterOn(g.key,i)?"checked":""}
        onchange="toggleFilter('${g.key}','${(i+'').replace(/'/g,"\\'")}')"> ${i}</label>`).join("")}
    </div>`).join("")}
  </aside>`;
}

/* ---------- COURSES ---------- */
function courseListCard(c){
  const files = c.topics.reduce((n,t)=>n+t.files.length,0);
  return `<article class="card imgcard click" onclick="go('#/course/${c.id}')">
    <div class="ic-photo"><div class="ph"><b>${c.title}</b><span>Course cover</span></div></div>
    <div class="ic-body">
      <span class="tag blue" style="align-self:flex-start">Course</span>
      <h3>${c.title}</h3>
      <div class="tags"><span class="tag">${c.system}</span><span class="tag">${c.lang}</span>
        <span class="tag">${c.topics.length} topics</span><span class="tag">${files} files</span></div>
      <span class="f-cta">Open course ${ic('arrow-right')}</span>
    </div>
  </article>`;
}
/* a course's searchable tags — the systems, languages and topics it covers */
function courseTags(c){
  return [c.system, c.lang].concat(c.topics.map(t=>t.name));
}
function filterCourses(){
  const q=((document.getElementById("course-search")||{}).value||"").toLowerCase();
  const checked=(fg)=>Array.prototype.slice.call(document.querySelectorAll('input[data-fg="'+fg+'"]:checked')).map(x=>x.value);
  const sys=checked("sys"), langs=checked("lang"), ftypes=checked("ftype");
  return COURSES.filter(c=>{
    if(q){ const hay=(c.title+" "+courseTags(c).join(" ")+" "
             + c.topics.reduce((a,t)=>a.concat(t.files.map(f=>f.name)),[]).join(" ")).toLowerCase();
           if(hay.indexOf(q)<0) return false; }
    if(sys.length && sys.indexOf(c.system)<0) return false;
    if(langs.length && langs.indexOf(c.lang)<0) return false;
    if(ftypes.length){ const types=c.topics.reduce((a,t)=>a.concat(t.files.map(f=>f.type)),[]);
      if(!ftypes.some(ft=>types.indexOf(ft)>=0)) return false; }
    return true;
  });
}
function applyCourseFilters(){
  const rows=filterCourses();
  const el=document.getElementById("course-results");
  if(el){ el.innerHTML = rows.length?rows.map(courseListCard).join("")
    :`<div class="panel"><p class="muted">No courses match the selected filters. Try clearing some.</p></div>`; icons(); }

/* shared document viewer panel */
function docViewer(title, type){
  const k = mediaKind(type);
  const label = k==="video"?"Video preview":k==="audio"?"Audio preview":k==="image"?"Image preview":"Document preview";
  let body;
  if(k==="video"){
    body = `<div class="dvid"><span class="dplay">${ic('play')}</span></div>`;
  }else if(k==="audio"){
    body = `<div class="dvid" style="aspect-ratio:auto;min-height:12rem;flex-direction:column;gap:1rem">
      <span class="dplay">${ic('audio-lines')}</span>
      <span style="color:rgba(255,255,255,.7);font-size:.85rem;font-weight:600">${title}</span></div>`;
  }else if(k==="image"){
    body = `<div class="dimg"><div class="dimg-h">${title}</div>
      <div class="dimg-body">
        <div class="mchart">${[62,84,48,96,70].map(h=>`<span class="mbar" style="height:${h}%"></span>`).join("")}</div>
        <div class="mpie"></div>
        <div class="dlegend"><span><i style="background:var(--blue)"></i>Secured</span>
          <span><i style="background:var(--green)"></i>Restored</span>
          <span><i style="background:#ddd6cc"></i>In process</span></div>
      </div></div>`;
  }else{
    body = `<div class="dpage">
      <div class="dpage-h">${title}</div>
      <div class="dpage-sub">Facilitating Commoning · Web Repository</div>
      <p class="dtext">This resource supports facilitators and field practitioners as they move a community through the Commoning process. It sets out what needs to happen, who is involved, and what to prepare before the session.</p>
      <div class="dpage-h2">Before you begin</div>
      <ul class="dul"><li>Read the local context and existing institutions.</li>
        <li>Confirm who needs to be in the room.</li>
        <li>Gather the formats and evidence listed overleaf.</li></ul>
      <div class="dpage-h2">During the session</div>
      <p class="dtext">Work through each step with the group, record decisions in the collective register, and agree the next field action before closing.</p>
      <div class="dpage-foot">Page 1 of 12 · v1.0 · 2026</div>
    </div>`;
  }
  return `<div class="panel docview">
    <div class="between" style="margin-bottom:.9rem">
      <h3 style="font-size:.95rem">${label}</h3>
      <button class="iconbtn" title="Full screen" onclick="toast('Open full-screen viewer (placeholder)')">${ic('maximize-2')}</button>
    </div>
    <div class="docview-body">${body}</div>
  </div>`;
}

function resourceCrumbs(r){
  const home={label:"Home",href:"#/home"};
  const raw=prevRoute||"";
  const query=raw.indexOf("?")>=0?raw.slice(raw.indexOf("?")+1):"";
  const p=raw.replace(/\?.*$/,"");
  const seg=p.replace(/^#\//,"").split("/");
  const topicId=(query.match(/topic=([^&]+)/)||[])[1];
  const here={label:r.title};
  const e = entityById(seg[1]);
  if((seg[0]==="modular"||seg[0]==="system") && e){
    const t=topicId?topicById(topicId):null;
    const mid = t?{label:t.name,href:"#/modular/"+seg[1]+"?topic="+topicId}:{label:"Resources",href:"#/system/"+seg[1]};
    return [home,{label:"Resource Systems & Themes",href:"#/resource-systems"},{label:e.name,href:"#/system/"+seg[1]},mid,here];
  }
  if(seg[0]==="curriculum" && e)
    return [home,{label:"Resource Systems & Themes",href:"#/resource-systems"},{label:e.name,href:"#/system/"+seg[1]},
            {label:"Atomized Course Curriculum",href:"#/curriculum/"+seg[1]},here];
  if(seg[0]==="search") return [home,{label:"Resource Library",href:"#/library"},{label:"Search Results",href:"#/search"},here];
  if(seg[0]==="my-learning") return [home,{label:"My Learning",href:"#/my-learning"},here];
  return [home,{label:"Resource Library",href:"#/library"},here];
}
function addResComment(id){

  (r.comments = r.comments || []).push({by:USER.name, date:"Today", at:"Just now", text});

}

let contributed = null;   /* holds the submitted title once sent */
function submitContribution(){
  const v = id => (document.getElementById(id)||{}).value || "";
  const title = v('cb-title').trim();
  if(!title){ toast("Enter a title for the resource"); focusIn('cb-title'); return; }
  if(!v('cb-system')){ toast("Select a " + metaLabel('system').toLowerCase()); return; }
  if(!v('cb-type')){ toast("Select a " + metaLabel('type').toLowerCase()); return; }
  submitForReview({title, purpose:v('cb-purpose').trim(), system:v('cb-system'), stage:v('cb-stage'),
    stake:v('cb-stake'), design:v('cb-design'), type:v('cb-type'), lang:v('cb-lang'),
    tags:docTags.slice()}, true);
  contributed = title;
  render();
}

function statusPill(st){
  const m = SUB_STATUS[st] || SUB_STATUS.pending;

}

function subSize(sub){ return sub.size || (sub.fields && sub.fields.size) || "2.4 MB"; }

/* ---- the three review dialogs ---- */
function askApprove(id){
  const sub = subById(id); if(!sub || !canReview()) return;
  const m = kindMeta(sub.fields.type);
  document.getElementById('pn-reason').innerHTML = `
    <div class="rd-head">
      <span class="rd-ic go">${ic('circle-check-big')}</span>
      <div>
        <h3>Approve this document?</h3>
        <p>It will be marked Approved and published to the Resource Library, where everyone can find it.</p>
      </div>
      <button class="modal-x" style="position:static" onclick="closeReason()">${ic('x')}</button>
    </div>
    <div class="rd-body">
      <div class="ap-file">
        <span class="doc-fi ${m.fi}">${ic(m.icon)}</span>
        <div><b>${sub.fields.title}</b><span>Submitted by ${sub.by} &middot; ${sub.date}</span></div>
      </div>
    </div>
    <div class="rd-foot">
      <button class="btn btn-outline" onclick="closeReason()">Cancel</button>
      <button class="btn btn-green" onclick="doApprove('${id}')">${ic('check')} Yes, Approve</button>
    </div>`;
  openOverlay('ov-reason');
}
function doApprove(id){ closeReason(); reviewSubmission(id, "approved"); }
function askChanges(id){ reasonDialog(id, "changes"); }
function askReject(id){ reasonDialog(id, "rejected"); }
function reasonDialog(id, status){
  const sub = subById(id); if(!sub || !canReview()) return;
  const changes = status==="changes";
  const m = kindMeta(sub.fields.type);
  document.getElementById('pn-reason').innerHTML = `
    <div class="rd-head">
      <span class="rd-ic ${changes?'warn':'stop'}">${ic(changes?'refresh-cw':'ban')}</span>
      <div>
        <h3>${changes?"Request Changes":"Reject Document"}</h3>
        <p>${changes?"Provide a reason to send back to the submitter."
                    :"Provide a reason for rejecting this document."}</p>
      </div>
      <button class="modal-x" style="position:static" onclick="closeReason()">${ic('x')}</button>
    </div>
    <div class="rd-body">
      <div class="ap-file">
        <span class="doc-fi ${m.fi}">${ic(m.icon)}</span>
        <div><b>${sub.fields.title}</b><span>Submitted by ${sub.by} &middot; ${sub.date}</span></div>
      </div>
      <div class="field" style="margin-top:1.25rem"><label>Reason <span class="req">*</span></label>
        <textarea id="rs-note" placeholder="${changes?'What needs to change before this can be published?':'Why is this not a fit for the library?'}"></textarea>
        <p class="hint">${ic('info')} This note will be shared with the submitter.</p></div>
    </div>
    <div class="rd-foot">
      <button class="btn btn-outline" onclick="closeReason()">Cancel</button>
      <button class="btn ${changes?'btn-amber':'btn-danger'}"
        onclick="sendReason('${id}','${status}')">${ic(changes?'refresh-cw':'circle-x')} ${changes?"Request Changes":"Yes, Reject"}</button>
    </div>`;
  openOverlay('ov-reason'); focusIn('rs-note');
}
function closeReason(){ closeOverlay('ov-reason'); }
function sendReason(id, status){
  const box = document.getElementById('rs-note');
  const note = box ? box.value.trim() : "";
  if(!note){ toast("Add a reason so the contributor knows why"); if(box) box.focus(); return; }
  closeReason();
  reviewSubmission(id, status, note);
}

/* ---------- ONE SUBMISSION ---------- */
/* the workflow a file moves through, and where each status sits on it */
function subById(id){ return SUBMISSIONS.find(x=>x.id===id); }
function subTab(params){
  const t=(params||{}).tab;
  return ["comments","workflow","versions","activity"].includes(t) ? t : "comments";
}
function addSubComment(id){
  const box = document.getElementById('sd-comment'); if(!box) return;
  const text = box.value.trim();
  if(!text){ toast("Write a comment first"); box.focus(); return; }
  const sub = subById(id); if(!sub) return;
  (sub.comments = sub.comments || []).push({by:USER.name, date:sub.date, at:"Just now", text});
  render();
}
function logSub(sub, what){ (sub.log = sub.log || []).unshift({what, by:USER.name, date:"Just now"}); }
function confirmSubDelete(id){
  const sub = subById(id); if(!sub) return;
  confirmDialog({
    title:"Are you sure you want to delete?",
    body:`<strong>${esc(sub.fields.title)}</strong> will be withdrawn and removed from your contributions. This cannot be undone.`,
    confirmLabel:"Delete file",
    onConfirm:()=>{ const i=SUBMISSIONS.indexOf(sub); if(i>=0) SUBMISSIONS.splice(i,1);
      toast("File deleted"); go('#/contributions'); }
  });
}

/* Activity & history — shared by a submission and a published resource.
   o = {tab, href(t), trail[], versions[], log[], thread[], postId, onPost} */
function activityBlock(o){
  const tb = (k,label) => `<button class="seg-tab ${o.tab===k?'on':''}" onclick="go('${o.href(k)}')">${label}</button>`;
  let body;
  if(o.tab==="versions"){
    body = `<ul class="vl">${o.versions.map((v,i)=>
      `<li class="vl-row${i===0?' now':''}">
        <span class="vl-v">${v.v}</span>
        <div class="vl-tx"><p class="vl-t">${v.what}${i===0?'<span class="vl-tag">Current</span>':''}</p>
          <p class="vl-s">${v.who}</p></div>
        <span class="vl-when">${v.when}</span></li>`).join("")}</ul>`;
  } else if(o.tab==="activity"){
    const mark = w => /upload|publish|version/i.test(w) ? 'upload'
      : /comment|repl/i.test(w) ? 'message-square'
      : /approve/i.test(w) ? 'check'
      : /reject|not accept/i.test(w) ? 'x'
      : /change/i.test(w) ? 'pencil'
      : /download/i.test(w) ? 'download' : 'file-text';
    body = `<ul class="al">${o.log.map(e=>
      `<li class="al-row">
        <span class="al-ic">${ic(mark(e.what))}</span>
        <p class="al-t"><b>${e.who}</b> ${e.what}</p>
        <span class="al-when">${e.when}<i>${e.at}</i></span></li>`).join("")}</ul>`;
  } else if(o.tab==="workflow"){
    body = `<ul class="tl-flow">${o.trail.map(e=>
      `<li class="tl-step ${e.cls}"><span class="tl-dot ${e.cls}">${ic(e.icon)}</span>
        <div class="tl-body"><p class="tl-t"><b>${e.who}</b> ${e.did}</p></div>
        <span class="tl-meta ${e.cls==='now'?'live':''}">${e.meta}</span></li>`).join("")}</ul>`;
  } else {
    body = `<div class="cm-box">
        <span class="pw-av sm avself">${ic('user-round')}</span>
        <div class="cm-grow">
          <textarea id="${o.postId}" placeholder="Add a comment…"></textarea>
          <div class="row" style="justify-content:flex-end;margin-top:.75rem">
            <button class="btn btn-primary sm" onclick="${o.onPost}">${ic('send')} Post</button>
          </div>
        </div>
      </div>
      ${o.thread.length
        ? `<div class="cm-list">${o.thread.map(c=>`<div class="cm-item">
            <span class="pw-av sm">${initials(c.by)}</span>
            <div><p class="cm-h"><b>${c.by}</b> &middot; ${c.date}${c.at?` &middot; ${c.at}`:''}</p>
              <p class="cm-t">${esc(c.text)}</p></div></div>`).join("")}</div>`
        : `<p class="tl-s" style="margin-top:1.25rem">No comments yet.</p>`}`;
  }
  return `<div class="sd-hist">
    <div class="sd-hist-h">${ic('history')} Activity &amp; history</div>
    <div class="sd-hist-b">
      <div class="seg-tabs">${tb('comments','Comments')}${tb('workflow','Submission Workflow')}${tb('versions','Version History')}${tb('activity','Activity Log')}</div>
      ${body}
    </div>
  </div>`;
}

screens.submission = (params) => {
  if(!isRegistered()) return gateScreen("Contribution","Sign in to see the files you have sent for review.");
  const sub = subById(params.id);
  if(!sub) return gateScreen("File not found","That contribution is no longer here.");
  const f = sub.fields, m = kindMeta(f.type), tab = subTab(params);
  const own = sub.by === USER.name;
  const row = (k,v) => v ? `<div class="sd-row"><span class="sd-k">${k}</span><span class="sd-v">${v}</span></div>` : '';
  const href = t => `#/submission/${sub.id}?tab=${t}`;
  /* the trail is newest first: what happened last sits at the top */
  const decision = {
    changes: {who:"Content Reviewer", did:"requested changes", cls:"changes", icon:"pencil"},
    approved:{who:"Content Reviewer", did:"approved and published", cls:"done", icon:"check"},
    rejected:{who:"Content Reviewer", did:"did not accept the file", cls:"stop", icon:"x"}
  }[sub.status];
  const trail = [];
  if(decision) trail.push({cls:decision.cls, icon:decision.icon, who:decision.who,
                           did:decision.did, meta:sub.date});
  else trail.push({cls:"now", icon:"clock", who:"Reviewer", did:"awaiting review", meta:"Pending"});
  (sub.log||[]).forEach(e => trail.push({cls:"done", icon:"pencil", who:e.by,
                                         did:e.what.toLowerCase(), meta:e.date}));
  trail.push({cls:"done", icon:"file-plus-2", who:sub.by, did:"submitted the document", meta:sub.date});

  const hist = activityBlock({
    tab: tab, href: href, trail: trail, postId: 'sd-comment',
    onPost: "addSubComment('"+sub.id+"')",
    versions: sub.versions || [{v:"v1.0", what:"original upload", when:sub.date,
                who: sub.by===USER.name ? "You ("+sub.by+")" : sub.by}],
    log: (sub.log||[]).map(e=>({who:e.by, what:e.what.toLowerCase(), when:e.date, at:"04:15 PM"}))
      .concat(sub.activity || (decision ? [{who:decision.who, what:decision.did, when:sub.date, at:"02:20 PM"}] : [])
        .concat([{who:sub.by, what:"document submitted", when:sub.date, at:"10:45 AM"},
                 {who:sub.by, what:"document uploaded", when:sub.date, at:"09:30 AM"}])),
    thread: (sub.comment ? [{by:"Content Reviewer", date:sub.date, at:decision?decision.did:"", text:sub.comment}] : [])
      .concat(sub.comments || [])
  });

  const fb = (sub.status==="changes"||sub.status==="rejected") && sub.comment;

  return header(null)
    + crumbs([{label: canReview()&&!own ? "Approvals" : "My Contributions",
               href: canReview()&&!own ? "#/approvals" : "#/contributions"}, {label:f.title}],
        `<button class="btn btn-outline sm" onclick="download('${esc(f.title)}')">${ic('download')} Download</button>
         ${own && !canReview() && sub.status!=="approved"?`<button class="iconbtn" title="Edit" onclick="openUploadDoc('${sub.id}')">${ic('pencil')}</button>`:''}
         ${own && !canReview()?`<button class="iconbtn danger" title="Delete" onclick="confirmSubDelete('${sub.id}')">${ic('trash-2')}</button>`:''}
         ${canReview() ? `
           ${sub.status!=="rejected"?`<button class="btn btn-outline danger sm" onclick="askReject('${sub.id}')">${ic('x')} Reject</button>`:''}
           ${sub.status!=="changes"?`<button class="btn btn-outline sm" onclick="askChanges('${sub.id}')">${ic('refresh-cw')} Request Changes</button>`:''}
           ${sub.status!=="approved"?`<button class="btn btn-green sm" onclick="askApprove('${sub.id}')">${ic('check')} Approve</button>`:''}` : ''}`)
    + `<main><div class="mx" style="padding-top:1.35rem;padding-bottom:4rem">

      ${fb?`<div class="sd-fb ${sub.status}">
        <span class="sd-fb-ic">${ic(SUB_STATUS[sub.status].icon)}</span>
        <div><b>${sub.status==="changes"?"The reviewer has asked for changes":"This file was not accepted"}</b>
          <p>${esc(sub.comment)}</p></div>
        ${sub.status==="changes" && own?`<button class="btn btn-primary sm" style="flex:none"
          onclick="openUploadDoc('${sub.id}')">${ic('pencil')} Edit and resend</button>`:''}
      </div>`:''}

      <div class="layout-wide">
        ${docViewer(f.title, f.type)}
        <aside class="panel">
          <h3 style="font-size:1.05rem;margin-bottom:1rem">File details</h3>
          <div class="detail-blk" style="margin:0 0 .9rem">
            ${statusPill(sub.status)}
          </div>
          ${META.map(mm => mm.label && f[mm.key]
            ? metaRow(mm.label, mm.key==="type" ? `<span class="tag blue">${f[mm.key]}</span>` : f[mm.key])
            : "").join("")}
          ${metaRow("Visibility", sub.status==="approved" ? "Public"
              : (own ? "Only you and the reviewers" : "Only the contributor and reviewers"))}
          ${metaRow("File size", subSize(sub))}
          ${metaRow("Version / Date", `<code style="font-family:var(--mono);font-size:.8rem">v1.0 &middot; ${sub.date}</code>`)}
          <div class="detail-blk" style="margin-top:.9rem">
            <div class="k">Uploaded by</div>
            <div class="row" style="gap:.65rem;align-items:center;margin-top:.35rem">
              <span class="pw-av">${initials(sub.by)}</span>
              <div><div style="font-weight:700;font-size:.9rem">${sub.by}</div>
                <div class="muted" style="font-size:.78rem">${sub.date}</div></div></div>
          </div>
          ${(f.tags||[]).length ? `<div class="detail-blk">
            <div class="k">Tags</div>
            <div class="tags" style="margin-top:.5rem">${f.tags.map(metaTag).join("")}</div>
          </div>` : ''}
        </aside>
      </div>

      ${hist}
    </div></main>` + footer();
};

/* ============================================================
   ADMIN — course wizard
   ============================================================ */
let courseDraft = null;
function newDraft(){ return {title:"",banner:"",desc:"",system:"Forests",lang:"English",topics:[],sel:0,step:1,uploadType:"Image"}; }
function ensureDraft(){ if(!courseDraft) courseDraft=newDraft(); return courseDraft; }
function startCourseFlow(){ courseDraft=newDraft(); go("#/course-new"); }
function draftSet(f,v){ ensureDraft()[f]=v; }
function draftSetUploadType(t){ ensureDraft().uploadType=t; go("#/course-new"); }
function draftUploadBanner(){ ensureDraft().banner="course-banner.jpg"; toast("Cover image uploaded (placeholder)"); go("#/course-new"); }
function draftRemoveBanner(){ ensureDraft().banner=""; go("#/course-new"); }
function draftToStep2(){ ensureDraft(); if(!courseDraft.title.trim()){ toast("Please enter a course name"); return; } courseDraft.step=2; go("#/course-new"); }
function draftToStep1(){ ensureDraft().step=1; go("#/course-new"); }
function draftAddTopic(){ ensureDraft(); courseDraft.topics.push({name:"Topic "+(courseDraft.topics.length+1),files:[]}); courseDraft.sel=courseDraft.topics.length-1; go("#/course-new"); }
function draftSelectTopic(i){ ensureDraft().sel=i; go("#/course-new"); }
function draftSetTopicName(i,v){ courseDraft.topics[i].name=v; }
function draftRemoveTopic(i){ ensureDraft().topics.splice(i,1);
  if(courseDraft.sel>=courseDraft.topics.length) courseDraft.sel=courseDraft.topics.length-1;
  if(courseDraft.sel<0) courseDraft.sel=0; go("#/course-new"); }
function draftAddFile(type){ ensureDraft(); if(!courseDraft.topics.length) draftAddTopic();
  courseDraft.topics[courseDraft.sel].files.push({name:"",type:type||"PDF"}); go("#/course-new"); }
function draftRemoveFile(i){ courseDraft.topics[courseDraft.sel].files.splice(i,1); go("#/course-new"); }
function draftSetFile(i,f,v){ courseDraft.topics[courseDraft.sel].files[i][f]=v; }
function draftCancel(){ courseDraft=null; go("#/courses"); }
function editCourse(id){
  const c=courseById(id); if(!c){ toast("Course not found"); return; }
  courseDraft={ editingId:c.id, title:c.title, banner:c.banner||"", desc:c.desc||"", system:c.system, lang:c.lang,
    topics:c.topics.map(t=>({name:t.name, files:t.files.map(f=>({name:f.name,type:f.type}))})),
    sel:0, step:1, uploadType:"Image" };
  go("#/course-new");
}
function confirmCourseDelete(id){
  const c=courseById(id); if(!c) return;
  confirmDialog({
    title:"Are you sure you want to delete?",
    body:`<strong>${c.title}</strong> will be removed, along with its ${c.topics.length} topic${c.topics.length!==1?'s':''} and every file inside them. This cannot be undone.`,
    confirmLabel:"Delete course",
    onConfirm:()=>deleteCourse(id)
  });
}
function deleteCourse(id){
  const i=COURSES.findIndex(c=>c.id===id);
  if(i<0){ toast("Course not found"); return; }
  const name=COURSES[i].title; COURSES.splice(i,1); toast("Course deleted — "+name); go("#/courses");
}
function publishCourse(){
  ensureDraft();
  if(!courseDraft.title.trim()){ toast("Course name is required"); draftToStep1(); return; }
  if(!courseDraft.topics.length){ toast("Add at least one topic before saving"); draftToStep2(); return; }
  const topics=courseDraft.topics.map((t,i)=>({id:"t"+(i+1), name:t.name||("Topic "+(i+1)),
    files:t.files.map(f=>({name:f.name||"Untitled file", type:f.type}))}));
  if(courseDraft.editingId){
    const c=courseById(courseDraft.editingId);
    if(c){ c.title=courseDraft.title.trim(); c.system=courseDraft.system; c.lang=courseDraft.lang;
           c.desc=courseDraft.desc; c.banner=courseDraft.banner; c.topics=topics; }
    const id=courseDraft.editingId; courseDraft=null; toast("Course updated"); go("#/course/"+id); return;
  }
  let base=courseDraft.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,24)||"course";
  let uid=base,n=2; while(courseById(uid)){ uid=base+"-"+n; n++; }
  COURSES.push({id:uid, title:courseDraft.title.trim(), system:courseDraft.system, lang:courseDraft.lang,
    desc:courseDraft.desc, banner:courseDraft.banner, topics:topics});
  courseDraft=null; toast("Course published"); go("#/course/"+uid);
}

let SHUT_GROUPS = {};
function _gkey(topicId, gi){ return topicId + "::" + gi; }

function isGroupShut(topicId, gi, holdsActive){
  const v = SHUT_GROUPS[_gkey(topicId, gi)];

}

/* rename a topic heading or a subtopic in place */
function startLabelEdit(el, topicId, kind, gi, code){
  if(!isAdmin() || !editMode || el.getAttribute('contenteditable')==='true') return;
  const original = el.textContent;
  let done = false;
  el.setAttribute('contenteditable','true');
  el.classList.add('renaming');
  el.focus();
  const sel = window.getSelection(); if(sel && sel.selectAllChildren) sel.selectAllChildren(el);
  const finish = save => {
    if(done) return; done = true;
    const val = el.textContent.replace(/\s+/g,' ').trim();
    el.removeAttribute('contenteditable'); el.classList.remove('renaming');
    if(!save || !val || val===original.trim()){ render(); return; }
    commitLabel(topicId, kind, gi, code, val);
  };
  el.onkeydown = e => {
    if(e.key==='Enter'){ e.preventDefault(); finish(true); }
    if(e.key==='Escape'){ e.preventDefault(); finish(false); }
  };
  el.onblur = () => finish(true);
}
function commitLabel(topicId, kind, gi, code, val){
  const groups = subtopicsFor(topicById(topicId));
  const g = groups[gi]; if(!g){ render(); return; }
  if(kind==='mod'){ g.mod = val; }
  else { const it = g.items.find(x=>x.code===code); if(it) it.name = val; }
  toast("Renamed — "+val); render();
}

/* reordering files by dragging — admin edit mode only */
let dragFrom = null;
function _clearDrag(){
  document.querySelectorAll('.filewrap').forEach(el=>el.classList.remove('dragging','dragover'));
}
function fileDragStart(e, i){
  dragFrom = i;
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', String(i)); }catch(_){}
  e.currentTarget.classList.add('dragging');
}
function fileDragEnd(){ dragFrom = null; _clearDrag(); }
function fileDragOver(e, i){
  if(dragFrom === null) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if(i !== dragFrom) e.currentTarget.classList.add('dragover');
}
function fileDragLeave(e){ e.currentTarget.classList.remove('dragover'); }
function fileDrop(e, topicId, subCode, to){
  e.preventDefault();
  let from = dragFrom;
  if(from === null){
    const raw = (()=>{ try{ return e.dataTransfer.getData('text/plain'); }catch(_){ return ""; } })();
    from = raw === "" ? null : parseInt(raw, 10);
  }
  dragFrom = null; _clearDrag();
  if(from === null || isNaN(from)) return;
  adminReorderFile(topicId, subCode, from, to);
}
function adminReorderFile(topicId, subCode, from, to){
  if(!isAdmin()) return;
  const sub = allSubtopics(topicById(topicId)).find(s=>s.code===subCode);
  if(!sub) return;
  if(from === to || from < 0 || to < 0 || from >= sub.files.length || to >= sub.files.length) return;
  const [moved] = sub.files.splice(from, 1);
  sub.files.splice(to, 0, moved);
  toast(`Moved “${moved.name}” to position ${to+1}`);
  render();
}
function adminRemoveFile(topicId, subCode, idx){
  if(!isAdmin()) return;
  const sub=allSubtopics(topicById(topicId)).find(s=>s.code===subCode);
  if(!sub) return; sub.files.splice(idx,1); toast("File removed"); render();
}

let docTags=[]; let docEditId=null;
function docThemeOptions(){ return ["Forests","Pastureland","Water"].concat(THEME_LIST.map(t=>t.name)).concat(["All Systems"]); }
function renderDocTags(){
  return docTags.map((t,i)=>`<span class="fchip">${t}<button onclick="removeDocTag(${i})">${ic('x')}</button></span>`).join("");
}
function addDocTag(v){ v=(v||"").trim(); if(!v) return; if(docTags.indexOf(v)<0) docTags.push(v);
  const el=document.getElementById('dc-tags'); if(el){ el.innerHTML=renderDocTags(); icons(); } }
function removeDocTag(i){ docTags.splice(i,1); const el=document.getElementById('dc-tags'); if(el){ el.innerHTML=renderDocTags(); icons(); } }
/* an id may point at a published document or at a submission of your own */
function editTarget(id){
  if(!id) return null;
  const sub = subById(id);
  if(sub) return {kind:"sub", sub:sub, r:sub.fields};
  const r = resById(id);
  return r ? {kind:"res", r:r} : null;
}
function openUploadDoc(editId){
  /* registered users may upload; a published document is the admin's to edit,
     a submission is its own contributor's */
  if(!isRegistered()) return;
  const t = editTarget(editId);
  if(editId && !t) return;
  if(t && t.kind==="sub" && t.sub.by!==USER.name) return;
  if(t && t.kind==="res" && !isAdmin()) return;
  const editing=!!t; docEditId = editing ? editId : null;
  const r = editing ? t.r : null;
  docTags = editing ? ((r&&r.tags&&r.tags.slice())||[]) : [];
  const ensure=(arr,v)=> (v && arr.indexOf(v)<0) ? [v].concat(arr) : arr;
  const opt=(items,ph,selv)=>`<option value="" disabled ${selv?'':'selected'}>${ph}</option>`+
    items.map(i=>`<option ${i===selv?'selected':''}>${i}</option>`).join("");
  const types = ensure(_fg('type').opts.slice(), r&&r.type);
  const systems = ensure(docThemeOptions(), r&&r.system);
  document.getElementById('pn-doc').innerHTML =
    modalHead(editing?(t.kind==="sub"?"Edit file":"Edit document"):(isAdmin()?"Upload a document":"Upload a file"),
      editing?(t.kind==="sub"?"Update this file and its details before it is reviewed"
                            :"Update this document’s file and metadata")
        :(isAdmin()?"Add a new document to the Resource Library with its metadata"
                   :"An admin reviews your file before it joins the Resource Library"),
      "closeUploadDoc()") +
    dropzone('cloud-upload',
      editing?"Drag &amp; drop to replace the file, or click to browse":"Drag and drop files here, or click to browse",
      `Supported: PDF, DOCX, XLSX, JPEG, PPTX, MP4, MP3${editing&&r?`<br>Current file: <strong>${esc(r.title)}</strong> — leave as is to keep it.`:''}`,
      "toast('Choose a file (placeholder)')", 'margin-bottom:1.35rem') +
    `<div class="field"><label>Title <span class="req">*</span></label>
      <input id="dc-name" value="${editing?esc(r.title):''}" placeholder="e.g. Facilitator Guide for Commoning"></div>
    <div class="field"><label>Purpose</label>
      <input id="dc-purpose" value="${editing?esc(r.purpose):''}" placeholder="One line describing what this resource is for"></div>
    <div class="grid g2" style="gap:1rem">
      <div class="field"><label>${metaLabel('system')} <span class="req">*</span></label>
        <div class="selw"><select id="dc-system">${opt(systems,"Select resource system", r&&r.system)}</select>${ic('chevron-down','cv')}</div></div>
      <div class="field"><label>${metaLabel('stage')}</label>
        <div class="selw"><select id="dc-stage">${opt(["All Stages"].concat(STAGES.map(x=>x.name)),"Select stage", r&&r.stage)}</select>${ic('chevron-down','cv')}</div></div>
      <div class="field"><label>${metaLabel('stake')}</label>
        <div class="selw"><select id="dc-stake">${opt(_fg('stake').opts,"Select stakeholder", r&&r.stake)}</select>${ic('chevron-down','cv')}</div></div>
      <div class="field"><label>${metaLabel('design')}</label>
        <div class="selw"><select id="dc-design">${opt(_fg('design').opts,"Select learning design", r&&r.design)}</select>${ic('chevron-down','cv')}</div></div>
      <div class="field"><label>${metaLabel('type')} <span class="req">*</span></label>
        <div class="selw"><select id="dc-type">${opt(types,"Select resource type", r&&r.type)}</select>${ic('chevron-down','cv')}</div></div>
      <div class="field"><label>${metaLabel('lang')}</label>
        <div class="selw"><select id="dc-lang">${opt(_fg('lang').opts,"Select language", r&&r.lang)}</select>${ic('chevron-down','cv')}</div></div>
    </div>
    <div class="field"><label>Tags</label>
      <div class="tagbox" onclick="var i=document.getElementById('dc-tag');if(i)i.focus();">
        <span id="dc-tags">${renderDocTags()}</span>
        <input id="dc-tag" placeholder="Type a tag and press Enter"
          onkeydown="if(event.key==='Enter'){event.preventDefault();addDocTag(this.value);this.value='';}"></div></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeUploadDoc()">Cancel</button>
      <button class="btn btn-primary" onclick="adminUploadDoc()">${editing?"Save changes":ic('upload')+(isAdmin()?" Upload":" Send for review")}</button></div>`;
  openOverlay('ov-doc'); focusIn('dc-name');
}
function closeUploadDoc(){ closeOverlay('ov-doc'); }
function adminUploadDoc(){
  if(!isRegistered()) return;
  const v=id=>(document.getElementById(id)||{}).value||"";
  const name=v('dc-name'), system=v('dc-system'), type=v('dc-type');
  if(!name.trim()){ toast("Enter a title"); return; }
  if(!system){ toast("Select a "+metaLabel('system').toLowerCase()); return; }
  if(!type){ toast("Select a "+metaLabel('type').toLowerCase()); return; }
  const fields = {
    title:name.trim(),
    purpose:v('dc-purpose').trim() || "Added to the Resource Library by the admin.",
    system:system, stage:v('dc-stage'), stake:v('dc-stake')||"Learner",
    design:v('dc-design')||"Both", type:type, lang:v('dc-lang')||"English",
    tags:docTags.slice()
  };
  if(docEditId){
    const t=editTarget(docEditId), id=docEditId;
    docEditId=null; closeUploadDoc();
    if(t && t.kind==="sub"){
      Object.assign(t.sub.fields, fields);
      logSub(t.sub, "Edited the details");
      toast("Changes saved — "+fields.title); go('#/submission/'+id); return;
    }
    if(t) Object.assign(t.r, fields);
    toast("Document updated — "+fields.title); go('#/resource/'+id); return;
  }
  /* only an admin publishes straight away */
  if(!isAdmin()) return submitForReview(fields);
  const id=(name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'doc')+'-'+(RES.length+1);
  RES.unshift(Object.assign({id:id, group:"supporting", version:"v1.0 · 2026", attribution:""}, fields));
  seedResourceTags();
  closeUploadDoc(); toast("Document uploaded — "+name.trim()); go('#/library');
}

  pending: {label:"Approval Pending",  cls:"pending", icon:"clock"},

/* the tab order on My Contributions */
const SUB_TABS = ["pending","approved","changes","rejected"];
function pendingCount(){ return SUBMISSIONS.filter(x=>x.status==="pending").length; }
function mySubmissions(){ return SUBMISSIONS.filter(x=>x.by===USER.name); }
function submitForReview(fields, quiet){
  subSeq += 1;
  SUBMISSIONS.unshift({id:"sub-"+subSeq, fields:Object.assign({}, fields),
    by:(fields.by || USER.name), date:resDate(subSeq), status:"pending", comment:""});
  if(quiet) return;
  closeUploadDoc();
  toast("Sent for review — an admin will check it before it is published");
  go('#/contributions');
}
function reviewSubmission(id, status, note){
  if(!canReview()) return;
  const sub = SUBMISSIONS.find(x=>x.id===id); if(!sub) return;
  const comment = (note||"").trim();
  /* a decision the contributor has to act on needs a reason */
  if((status==="changes"||status==="rejected") && !comment){
    toast("Add a comment so the contributor knows what to change");
    return;
  }
  sub.status = status; sub.comment = comment;
  if(status==="approved"){
    const f = sub.fields;
    const rid=(f.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'doc')+'-'+(RES.length+1);
    RES.unshift(Object.assign({id:rid, group:"supporting", version:"v1.0 · 2026",
      attribution:"Contributed by "+sub.by}, f));
    seedResourceTags();
    toast("Approved and published — "+f.title);
  } else {
    toast((status==="changes"?"Changes requested — ":"Not accepted — ")+sub.fields.title);
  }
  render();
}

/* live suggestions under the header field — matched the same way the results page matches */
function searchMatches(q){
  const t=(q||"").trim().toLowerCase();
  if(!t) return [];
  return RES.filter(r => (r.title+" "+r.purpose+" "+resTags(r).join(" ")).toLowerCase().includes(t)).slice(0,7);
}
function navSuggest(q){
  const box=document.getElementById('ns-sug'); if(!box) return;
  const t=(q||"").trim();
  if(!t){ box.classList.remove('open'); box.innerHTML=""; return; }
  const hits=searchMatches(t);
  const mark = txt => txt.replace(new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>");
  box.innerHTML = hits.length
    ? hits.map(r=>{const m=kindMeta(r.type);
        return `<button class="ns-hit" onclick="closeNavSearch();go('#/resource/${r.id}')">
          <span class="doc-fi ${m.fi}">${ic(m.icon)}</span>
          <span class="ns-hit-tx"><b>${mark(r.title)}</b><span>${r.type} &middot; ${r.lang}</span></span></button>`;}).join("")
      + `<button class="ns-all" onclick="runSearch(document.getElementById('ns-input').value)">
          ${ic('search')} See all results for &ldquo;${esc(t)}&rdquo;</button>`
    : `<p class="ns-none">Nothing matches &ldquo;${esc(t)}&rdquo; yet. Press Enter to search anyway.</p>`;
  box.classList.add('open');
  icons();
}

  {bg:"#f8e2e3", ink:"#3b3531", key:"#c08a8b"},   // pale pink
  {bg:"#ffb600", ink:"#3b3531", key:"#b07c00"},   // amber
  {bg:"#00b050", ink:"#26301f", key:"#00803a"},   // green
  {bg:"#9e5b2b", ink:"#fff",    key:"#7a431e"}    // brown
];
function indexTint(i){ const t=INDEX_TINTS[i % INDEX_TINTS.length];
  return `--ct:${t.bg};--ci:${t.ink};--ck:${t.key}`; }
/* the matrix itself — shared by the modal and the course outline page */
function courseIndexGrid(topic, cellHref){
  const groups = subtopicsFor(topic).filter(g=>g.items.length);
  if(!groups.length) return `<p class="tl-s">This course has no topics yet.</p>`;
  const maxRow = groups.reduce((m,g)=>Math.max(m,g.items.length),0);
  return `<div class="cidx" style="--n:${maxRow}">
      <div class="cidx-row cidx-head">
        <span class="cidx-hh lbl">Topic</span><span class="cidx-hh">Subtopics</span>
      </div>
      ${groups.map((g,gi)=>`
        <div class="cidx-row" style="${indexTint(gi)}">
          <div class="cidx-h">
            <b>${indexSeries(g)}</b>${indexLabel(g.mod, topic)}
          </div>
          <div class="cidx-cells">${g.items.map(it=>`
            <button class="cidx-cell" onmouseenter="cidxTip(this,'${escj(it.code)}','${escj(it.name)}')" onmouseleave="cidxTip(null)" onfocus="cidxTip(this,'${escj(it.code)}','${escj(it.name)}')" onblur="cidxTip(null)"
              onclick="go('${cellHref(it.code)}')">${it.code}</button>`).join("")}${
            Array.from({length: Math.max(0, maxRow - g.items.length)}, ()=>`<span class="cidx-gap"></span>`).join("")}</div>
        </div>`).join("")}
    </div>
    <div class="cidx-tip" id="cidx-tip" hidden></div>`;
}
function indexBlurb(topic){
  const groups = subtopicsFor(topic).filter(g=>g.items.length);
  const total = groups.reduce((n,g)=>n+g.items.length,0);
  return `${total} subtopic${total!==1?'s':''} across ${groups.length} topic${groups.length!==1?'s':''}.`;
}
/* the floating label for a hovered index number */
function cidxTip(el, code, name){
  const t=document.getElementById('cidx-tip'); if(!t) return;
  if(!el){ t.hidden=true; return; }
  t.textContent = name; t.insertAdjacentHTML('afterbegin','<b></b>');
  t.firstChild.textContent = code;
  t.hidden=false;
  const c=el.getBoundingClientRect(), b=t.getBoundingClientRect();
  let x = c.right + 8;
  if(x + b.width > window.innerWidth - 8) x = c.left - b.width - 8;
  x = Math.max(8, x);
  let y = c.top + c.height/2 - b.height/2;
  y = Math.max(8, Math.min(y, window.innerHeight - b.height - 8));
  t.style.left = x+'px'; t.style.top = y+'px';
}
// column heading without the topic name it repeats, plus its number series
function indexLabel(mod, topic){
  const p = (topic ? topic.name : "") + " \u2014 ";
  return (topic && mod.indexOf(p)===0) ? mod.slice(p.length) : mod;
}
function indexSeries(g){
  const c = (g.items[0]||{}).code || "";
  return c.length>2 ? c.slice(0,c.length-2)+"00" : "";
}
function openTour(){
  document.getElementById('pn-tour').innerHTML =
    modalHead("Take a tour · get started","Five steps to find your way around the repository.","closeTour()") +
    `<ol class="tour">${JOURNEY5.map(s=>`
      <li><button class="tour-step" onclick="closeTour();go('${s.href}')">
        <span class="tour-n">${s.n}</span>
        <span class="tour-tx">
          <em>${ic(s.icon)} ${s.k}</em>
          <b>${s.q}</b>
          <span>${s.d}</span>
        </span>
        <span class="tour-go">${ic('arrow-right')}</span>
      </button></li>`).join("")}</ol>
    <div class="row" style="justify-content:flex-end;margin-top:1.5rem">
      <button class="btn btn-outline" onclick="closeTour();go('#/resource-systems')">Choose a resource system</button>
      <button class="btn btn-primary arrow" onclick="closeTour();go('#/learning-approach')">Start learning ${ic('arrow-right')}</button></div>`;
  openOverlay('ov-tour');
}
function closeTour(){ closeOverlay('ov-tour'); }

/* ============================================================
   MENUS · TOAST · ROUTER
   ============================================================ */
function pwClose(){ const p=document.getElementById('profilew'); if(p) p.classList.remove('open'); }
function appsClose(){ const a=document.getElementById('appsw'); if(a) a.classList.remove('open'); }
function langClose(){ const l=document.getElementById('langw'); if(l) l.classList.remove('open'); }
function toggleProfile(e){ e.stopPropagation(); appsClose(); langClose();
  const p=document.getElementById('profilew'); if(p) p.classList.toggle('open'); }
function toggleApps(e){ e.stopPropagation(); pwClose(); langClose();
  const a=document.getElementById('appsw'); if(a) a.classList.toggle('open'); }
function toggleLang(e){ e.stopPropagation(); pwClose(); appsClose();
  const l=document.getElementById('langw'); if(l) l.classList.toggle('open'); }

function toggleMobNav(e){ e.stopPropagation(); const m=document.getElementById('mobnav'); if(m) m.classList.toggle('open'); }
function closeMobNav(){ const m=document.getElementById('mobnav'); if(m) m.classList.remove('open'); }
document.addEventListener('click',e=>{
  ['profilew','appsw','langw'].forEach(id=>{
    const el=document.getElementById(id);
    if(el && el.classList.contains('open') && !el.contains(e.target)) el.classList.remove('open');
  });
});
['ov-search','ov-contact','ov-tour','ov-topic','ov-doc','ov-pwd','ov-theme','ov-img','ov-confirm','ov-file'].forEach(id=>{
  const o=document.getElementById(id);
  if(o) o.addEventListener('click',e=>{ if(e.target.id===id) o.classList.remove('open'); });
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ ['ov-search','ov-contact','ov-tour','ov-topic','ov-doc','ov-pwd','ov-theme','ov-img','ov-confirm','ov-file']
    .forEach(id=>closeOverlay(id)); }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); }
});

let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  if(!t) return;
  t.innerHTML = `<i data-lucide="circle-check-big"></i><span>${msg}</span>`;
  icons();
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---- router ---- */
function parseHash(){
  const raw=(location.hash||"#/home").replace(/^#\//,"");
  const [pathPart,queryPart]=raw.split("?");
  const parts=pathPart.split("/").filter(Boolean);
  const params={};
  if(queryPart){ queryPart.split("&").forEach(kv=>{ const[k,v]=kv.split("="); params[k]=v; }); }
  return {parts,params};
}
/* the last page we rendered — switching a tab within a page must not scroll away */
let _lastPath = null;
function render(){
  const {parts,params}=parseHash();
  const name=parts[0]||"home";
  const path=parts.join("/");
  let html;
  if(name==="system"||name==="theme"){ params.id=parts[1]; html=screens.system(params); }
  else if(name==="curriculum"){ params.id=parts[1]; html=screens.curriculum(params); }
  else if(name==="modular"){ params.id=parts[1]; html=screens.modular(params); }
  else if(name==="outline"){ params.id=parts[1]; html=screens.outline(params); }
  else if(name==="course"){ params.id=parts[1]; html=screens.course(params); }
  else if(name==="file"){ params.id=parts[1]; params.t=parts[2]; params.f=parts[3]; html=screens.file(params); }
  else if(name==="doc"){ params.id=parts[1]; html=screens.doc(params); }
  else if(name==="stage"){ params.id=parts[1]; html=screens.stage(params); }
  else if(name==="resource"){ params.id=parts[1]; html=screens.resource(params); }
  else if(name==="story"){ params.id=parts[1]; html=screens.story(params); }
  else if(name==="submission"){ params.id=parts[1]; html=screens.submission(params); }
  else if(name==="help" && parts[1]){ params.id=parts[1]; html=screens.helptopic(params); }
  else if(screens[name]){ html=screens[name](params); }
  else { html=screens.home(); }
  document.getElementById("app").innerHTML=html;
  icons();
  closeMobNav();
  /* only jump to the top on a genuine page change, not on a tab or filter switch */
  if(path!==_lastPath){ window.scrollTo(0,0); _lastPath=path; }
  syncNavShadow();
}
function go(hash){ if(location.hash===hash){ render(); } else { location.hash=hash; } }

/* the header lifts off the page only once you scroll */
function syncNavShadow(){
  const n=document.querySelector('nav.top');
  if(n) n.classList.toggle('scrolled', window.scrollY>4);
}
window.addEventListener('scroll', syncNavShadow, {passive:true});
window.addEventListener("hashchange", e=>{
  if(e && e.oldURL && e.oldURL.indexOf("#")>=0) prevRoute = e.oldURL.slice(e.oldURL.indexOf("#"));
  render();
});

/* ---- boot ---- */
loadRole();
loadLang();
seedResourceTags();
seedTopicMeta();
seedResourceHistory();
document.documentElement.setAttribute('lang', lang);
loadLibView();
if(!location.hash) location.hash="#/home";
render();
