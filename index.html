<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Facilitating Commoning — Web Repository Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FES KARYASHALA — LOW-FIDELITY WIREFRAME PROTOTYPE
   Grayscale, structure-first. No brand color, no decoration.
   ============================================================ */
:root{
  /* Frappe-UI-style monochrome tokens */
  --ink:#171717;
  --ink-2:#383838;
  --ink-3:#7c7c7c;
  --line:#ededed;
  --line-2:#e2e2e2;
  --bg:#f7f7f8;
  --panel:#ffffff;
  --panel-2:#f8f8f8;
  --fill:#f3f3f3;
  --fill-2:#ededed;
  --active:#0a0a0a;
  --radius:8px;
  --maxw:1160px;
  --gap:20px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;
  --shadow-sm:0 1px 2px rgba(15,15,15,.04);
  --shadow-md:0 4px 14px rgba(15,15,15,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);
  background:var(--bg);
  font-size:14px;
  line-height:1.5;
  letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:'cv11','ss01';
}
a{color:inherit}
img{max-width:100%}

/* ---------- Wireframe primitives ---------- */
.wf-note{font-size:11px;color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase}
.ph-img{
  background:
    repeating-linear-gradient(45deg,transparent,transparent 11px,rgba(0,0,0,.03) 11px,rgba(0,0,0,.03) 12px),
    var(--panel-2);
  border:1px solid var(--line);
  border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-4,#999);font-size:12px;text-align:center;
  min-height:120px;
}
.ph-line{height:10px;background:var(--fill);border-radius:3px;margin:7px 0}
.ph-line.w80{width:80%}.ph-line.w60{width:60%}.ph-line.w40{width:40%}.ph-line.w90{width:90%}
.icon-box{
  width:34px;height:34px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel-2);display:inline-flex;align-items:center;justify-content:center;
  font-size:16px;flex:0 0 auto;
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--line-2);background:var(--panel);color:var(--ink);
  padding:8px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;
  text-decoration:none;white-space:nowrap;box-shadow:var(--shadow-sm);transition:background .12s,box-shadow .12s,border-color .12s;
}
.btn:hover{background:var(--fill);border-color:var(--line-2)}
.btn.primary{background:var(--active);color:#fff;border-color:var(--active)}
.btn.primary:hover{background:#000}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.link{border:none;background:none;box-shadow:none;padding:4px 0;text-decoration:underline;color:var(--ink);font-weight:500}
.btn.block{width:100%;justify-content:center}
.btn.icon-btn{padding:9px 11px;line-height:1;font-size:15px;background:var(--fill);border-color:var(--line-2);box-shadow:var(--shadow-sm)}
.btn.icon-btn:hover{background:var(--fill-2);border-color:var(--ink-3);box-shadow:var(--shadow-md)}

/* ---------- Layout ---------- */
.container{max-width:100%;margin:0;padding:0 88px}
@media(max-width:1100px){ .container{padding:0 40px} }
@media(max-width:700px){ .container{padding:0 20px} }
header.site{
  background:var(--panel);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
}
.nav{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 12px;min-height:60px;padding:8px 0}
.logo{
  border:1.5px solid var(--ink);border-radius:var(--radius);
  padding:6px 10px;font-weight:700;letter-spacing:.04em;cursor:pointer;font-size:13px;
  flex:0 0 auto;
}
.logo small{display:block;font-weight:400;font-size:9px;color:var(--ink-3);letter-spacing:.08em}
.nav ul{list-style:none;display:flex;gap:2px;margin:0;padding:0;flex-wrap:wrap;min-width:0}
.nav a.navlink{
  text-decoration:none;color:var(--ink-2);font-size:13px;
  padding:6px 8px;border-radius:var(--radius);cursor:pointer;display:inline-block;white-space:nowrap;
}
.nav a.navlink:hover{background:var(--fill)}
.nav a.navlink.active{color:var(--ink);background:var(--fill-2);font-weight:600}
.nav .acct{justify-self:end;display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.nav .acct .navlink{white-space:nowrap}
.role-chip{font-size:11px;border:1px solid var(--ink);border-radius:20px;padding:3px 10px;background:var(--panel-2);white-space:nowrap}
/* Profile dropdown */
.profile{position:relative}
.profile-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:24px;padding:3px 10px 3px 3px;cursor:pointer;font-size:12px}
.profile-btn:hover{background:var(--fill)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--active);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto;letter-spacing:.02em}
.profile-btn .pname{white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.profile-btn .caret{color:var(--ink-3);font-size:10px}
.profile-menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-width:200px;box-shadow:0 4px 16px rgba(0,0,0,.14);padding:6px;display:none;z-index:45}
.profile-menu.open{display:block}
.profile-menu a{display:block;padding:8px 10px;border-radius:3px;font-size:13px;cursor:pointer;color:var(--ink);white-space:nowrap}
.profile-menu a:hover{background:var(--fill)}
.pm-head{padding:8px 10px}
.pm-head strong{font-size:13px}
.pm-head .pm-sub{font-size:11px;color:var(--ink-3)}
.pm-div{border-top:1px solid var(--line-2);margin:6px 0}

/* Breadcrumbs */
.crumbs{padding:14px 0;font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--ink-2);text-decoration:none;cursor:pointer;font-weight:500}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs span.sep{margin:0 9px;color:var(--ink-3);font-weight:400}
.crumbs span.here{color:var(--ink);font-weight:700}

main{min-height:60vh;padding-bottom:40px}

/* Section scaffolding */
.section{padding:26px 0}
.section h2{font-size:20px;margin:0 0 4px}
.section .sub{color:var(--ink-2);margin:0 0 18px;max-width:720px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin-bottom:8px}
.divider{border:none;border-top:1px solid var(--line-2);margin:0}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm)}

/* Grid */
.grid{display:grid;gap:var(--gap)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:var(--gap);flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* Cards */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm);
}
.card h3{margin:0;font-size:15px}
.card p{margin:0;color:var(--ink-2);font-size:13px}
.card .cta{margin-top:auto}
.card.click{cursor:pointer;transition:box-shadow .14s,transform .14s,border-color .14s}
.card.click:hover{box-shadow:var(--shadow-md);border-color:var(--line-2);transform:translateY(-2px)}

/* System card */
.syscard .ph-img{min-height:96px}
.syscard.small{padding:13px}
.syscard.small .ph-img{min-height:64px}

/* Hero */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:34px;margin-top:18px}
.hero h1{font-size:30px;margin:0 0 12px;line-height:1.2}
.hero p.lead{font-size:16px;color:var(--ink-2);max-width:640px;margin:0 0 20px}
.hero-split{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center}
.hero-media{min-height:220px;align-self:stretch}
@media(max-width:760px){ .hero-split{grid-template-columns:1fr} .hero-media{min-height:150px} }

/* Pathway */
.pathway{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.pw-step{
  flex:1 1 150px;min-width:140px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);padding:11px 12px;cursor:pointer;position:relative;transition:background .12s;
}
.pw-step:hover{background:var(--fill)}
.pw-step.static{cursor:default;pointer-events:none}
.pw-step .num{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.pw-step .nm{font-size:13px;font-weight:600;margin-top:2px}
.pw-step.active{background:var(--active);border-color:var(--active)}
.pw-step.active .nm,.pw-step.active .num{color:#fff}
.pw-arrow{align-self:center;color:var(--line);font-size:16px}
.pathway.compact .pw-step{flex-basis:120px;min-width:110px;padding:8px 9px}

/* Resource card */
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow-sm)}
.rcard .rc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.rcard h4{margin:0;font-size:14px;line-height:1.35}
.rcard .purpose{color:var(--ink-2);font-size:12.5px;margin:0}
.meta-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.tag.solid{background:var(--fill-2);border-color:var(--fill-2)}
.rc-actions{display:flex;gap:8px;margin-top:2px}
.rc-type-chip{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);border:1px dashed var(--line);border-radius:3px;padding:2px 6px}

/* Category columns (Learn / Facilitate / Act / Support) */
.cat-col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px}
.cat-head{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line-2);padding-bottom:9px}
.cat-head .lbl{font-weight:700;font-size:13px;letter-spacing:.04em}
.cat-head .desc{font-size:11px;color:var(--ink-3)}

/* Filter sidebar */
.layout-side{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:sticky;top:76px}
.fgroup{border-bottom:1px solid var(--line-2);padding:12px 0}
.fgroup:first-child{padding-top:0}
.fgroup h4{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.fopt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding:3px 0;cursor:pointer}
.fopt input{accent-color:var(--ink)}
.filter-actions{display:flex;gap:8px;margin-top:14px}

/* Search bar */
.searchfield{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:11px 14px}
.searchfield input{border:none;outline:none;flex:1;font-size:14px;background:transparent}
.searchfield .icon-box{width:28px;height:28px;font-size:14px}

/* Process / flow diagram */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flow .node{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:10px 14px;font-size:13px;text-align:center;min-width:96px}
.flow .node.strong{border-width:1.5px;font-weight:600}
.flow .arw{color:var(--ink-3);font-size:15px}

/* Model diagram */
.model{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative}
.model .m-node{border:1.5px solid var(--ink);border-radius:var(--radius);background:var(--panel);padding:18px 14px;text-align:center;font-weight:600}
.model-thread{margin-top:14px;border:1px dashed var(--ink);border-radius:var(--radius);padding:12px;text-align:center;background:var(--panel-2);font-weight:700;letter-spacing:.05em}

/* Stage reveal (home journey) */
.reveal{border:1px solid var(--line-2);border-top:none;border-radius:0 0 var(--radius) var(--radius);background:var(--panel-2);padding:14px;font-size:13px;color:var(--ink-2)}
.hidden{display:none}

/* Info list */
.qa{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.qa .qitem{border-bottom:1px solid var(--line-2)}
.qa .qitem:last-child{border-bottom:none}
.qa .qq{padding:13px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.qa .qq:hover{background:var(--panel-2)}
.qa .qa-body{padding:0 16px 14px;color:var(--ink-2);font-size:13px}

/* Context definition rows (resource detail) */
.ctx-row{border:1px solid var(--line-2);border-radius:var(--radius);padding:12px 14px;background:var(--panel)}
.ctx-row h5{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3)}
.ctx-row p{margin:0;color:var(--ink-2);font-size:13px}

/* Callout / recommended next */
.callout{border:1.5px solid var(--ink);border-radius:var(--radius);background:var(--panel-2);padding:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.callout .txt strong{display:block;font-size:14px}
.callout .txt span{font-size:13px;color:var(--ink-2)}

/* Video placeholder */
.video-ph{position:relative;min-height:170px}
.video-ph .play{width:52px;height:52px;border-radius:50%;border:2px solid var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-3)}

/* Footer */
footer.site{background:var(--panel);border-top:1px solid var(--line);margin-top:20px}
footer.site .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px;padding:30px 0}
footer.site h5{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
footer.site ul{list-style:none;margin:0;padding:0}
footer.site li{padding:4px 0;color:var(--ink-3);font-size:13px;cursor:pointer}
footer.site li:hover{color:var(--ink);text-decoration:underline}
footer .bar{border-top:1px solid var(--line-2);padding:14px 0;font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* Search overlay */
.overlay{position:fixed;inset:0;background:rgba(30,30,30,.35);z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:9vh}
.overlay.open{display:flex}
.searchpanel{background:var(--panel);border:1px solid var(--ink);border-radius:var(--radius);width:min(620px,92vw);padding:20px}
.searchpanel h3{margin:0 0 4px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;background:var(--panel-2)}
.chip:hover{background:var(--fill)}

/* result rows */
.result-row{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.result-row .rr-main{flex:1}
.result-row h4{margin:0 0 3px;font-size:15px}

/* utility */
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb0{margin-bottom:0}
.muted{color:var(--ink-3)}
.stack{display:flex;flex-direction:column;gap:14px}
.wrapline{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px;margin:16px 0}
.wrapline::before,.wrapline::after{content:"";flex:1;border-top:1px solid var(--line-2)}
.pill-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
/* horizontal scroll row (Trending Courses) */
.hscroll{display:flex;gap:16px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{height:8px}
.hscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px}
.hscroll > *{flex:0 0 270px;scroll-snap-align:start}

/* Responsive */
@media(max-width:1000px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
  .layout-side{grid-template-columns:1fr}
  .filters{position:static}
  footer.site .cols{grid-template-columns:1fr 1fr}
  .model{grid-template-columns:1fr}
}
@media(max-width:640px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .nav{grid-template-columns:auto 1fr}
  .nav ul{display:none}
  .nav .acct{flex-wrap:wrap;justify-content:flex-end;gap:6px}
  .hero h1{font-size:24px}
  footer.site .cols{grid-template-columns:1fr}
}
/* V3 — badge chip (Course / Module / Video / etc.) */
.badge{font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:var(--active);color:#fff;border-radius:3px;padding:3px 8px;white-space:nowrap;flex:0 0 auto;align-self:flex-start}
/* V3 — course-card grid (Explore Resources under a system/theme) */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px}
.course-card{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:box-shadow .12s}
.course-card{box-shadow:var(--shadow-sm)}
.course-card:hover{box-shadow:var(--shadow-md);border-color:var(--line-2);transform:translateY(-2px)}
.course-card .num-badge{position:absolute;top:8px;left:8px;width:22px;height:22px;border-radius:50%;background:var(--active);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;z-index:2}
.course-thumb{min-height:110px;position:relative;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:11px;
  background:repeating-linear-gradient(45deg,transparent,transparent 9px,#e6e6e6 9px,#e6e6e6 10px),var(--fill);border-bottom:1px solid var(--line)}
.course-thumb .play,.file-prev .play{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--panel)}
.course-thumb .doc-ic,.file-prev .doc-ic{width:38px;height:46px;border:2px solid var(--ink-3);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ink-3);background:var(--panel)}
/* course viewer — active topic + file cards */
.cur-unit.active{background:var(--fill-2);border-radius:3px;font-weight:600}
.file-card{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.file-prev{min-height:100px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:11px;border-bottom:1px solid var(--line);
  background:repeating-linear-gradient(45deg,transparent,transparent 9px,#e6e6e6 9px,#e6e6e6 10px),var(--fill)}
.file-body{padding:10px 12px}
/* document detail page */
.doc-layout{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
.doc-preview{padding:16px}
.doc-prev-stage{min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border-radius:var(--radius);
  color:var(--ink-3);background:repeating-linear-gradient(45deg,transparent,transparent 11px,#ececec 11px,#ececec 12px),var(--fill)}
.doc-prev-glyph{font-size:52px;line-height:1;filter:grayscale(1);opacity:.55}
.doc-prev-name{font-size:13px;color:var(--ink-2)}
.doc-meta{padding:18px 20px;position:sticky;top:76px}
.doc-meta-row{padding:12px 0;border-bottom:1px solid var(--line)}
.doc-meta-row h5{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700}
.doc-meta-val{font-size:14px;color:var(--ink)}
.doc-pill{display:inline-block;border:1px solid var(--line-2);border-radius:999px;padding:3px 12px;font-size:12px;background:var(--panel)}
.doc-ver{background:var(--fill-2);border:1px solid var(--line);border-radius:5px;padding:2px 8px;font-family:'JetBrains Mono',monospace;font-size:12px}
.doc-uploader{display:flex;align-items:center;gap:10px}

   ============================================================ */
let currentRole = "visitor";
let prevRoute = "#/home"; // the route the user came from (for contextual breadcrumbs + Back)
/* Persist the signed-in role so a refresh keeps the user logged in (only manual Sign Out clears it) */
function saveRole(){ try{ localStorage.setItem("fc_role", currentRole); }catch(e){} }
function loadRole(){ try{ var r=localStorage.getItem("fc_role"); if(r==="visitor"||r==="registered"||r==="admin") currentRole=r; }catch(e){} }
function goBack(){ if(prevRoute && prevRoute!==location.hash){ go(prevRoute); } else if(window.history && history.length>1){ history.back(); } else { go("#/home"); } }
const ROLE_LABEL = {visitor:"Visitor", registered:"Registered User", admin:"Platform Super Admin"};
function roleLabel(){return ROLE_LABEL[currentRole];}
function isAdmin(){return currentRole==="admin";}
function isRegistered(){return currentRole==="registered"||currentRole==="admin";}
function canDownload(){return currentRole!=="visitor";}
function setRole(role, dest){ currentRole=role; saveRole(); toast("Signed in as "+ROLE_LABEL[role]); go(dest||(role==="admin"?"#/admin":"#/home")); }
function signOut(){ currentRole="visitor"; saveRole(); toast("Signed out"); go("#/home"); }

    const arrow=i<STAGES.length-1?`<div class="pw-arrow">→</div>`:"";

    : `Thumbnail`;

}

// File card for a course topic (Image / PDF / Video). Pass course/topic/index to make View open the file page.
function filePreviewGlyph(type){
  const t=(type||"").toLowerCase();
  return t==="video" ? `<div class="play">▶</div>` : t==="pdf" ? `<div class="doc-ic">PDF</div>` : t==="image" ? `Image` : `File`;
}
function fileCard(f, courseId, topicId, idx, docCtx){
  const view = docCtx ? `go('#/doc/${docCtx.sys}?g=${docCtx.group}&topic=${docCtx.topic}&sub=${docCtx.sub}&i=${idx}')`
    : (courseId!=null) ? `go('#/file/${courseId}/${topicId}/${idx}')`
    : `toast('Open ${f.type}: ${f.name} (placeholder)')`;
  return `<div class="file-card">
    <div class="file-prev" style="cursor:pointer" onclick="${view}">${filePreviewGlyph(f.type)}</div>
    <div class="file-body">
      <span class="badge">${f.type}</span>
      <h4 style="margin:6px 0 0;font-size:13px">${f.name}</h4>
      <div class="rc-actions" style="margin-top:8px">
        <a class="btn sm primary" onclick="${view}">View</a>
        <a class="btn sm" onclick="download('${f.name}')">Download</a>
      </div>
    </div>
  </div>`;
}

// Admin variant of a file card — with Replace / Delete instead of View / Download
function adminFileCard(f){
  const t=(f.type||"").toLowerCase();
  const prev = t==="video" ? `<div class="play">▶</div>` : t==="pdf" ? `<div class="doc-ic">PDF</div>` : t==="image" ? `Image` : `File`;
  return `<div class="file-card">
    <div class="file-prev">${prev}</div>
    <div class="file-body">
      <span class="badge">${f.type}</span>
      <h4 style="margin:6px 0 0;font-size:13px">${f.name}</h4>

        <a class="btn sm" onclick="toast('Delete file (placeholder)')">Delete</a>

    </div>
  </div>`;
}

/* Create-course wizard (admin) — Phase 1: course details · Phase 2: topics & files. In-memory. */
let courseDraft = null;
function newDraft(){ return {title:"",banner:"",desc:"",system:"Forests",lang:"English",topics:[],sel:0,step:1,uploadType:"Image"}; }
function draftSetUploadType(t){ ensureCourseDraft().uploadType=t; go("#/course-new"); }
function ensureCourseDraft(){ if(!courseDraft) courseDraft=newDraft(); return courseDraft; }
function startCourseFlow(){ courseDraft=newDraft(); go("#/course-new"); }
/* Quick-start templates — pre-fill the draft to remove the blank-page problem */
const COURSE_TEMPLATES = [
  {id:"forests", name:"Forests starter", title:"Commoning of Forests", system:"Forests", lang:"Hindi",
    desc:"Rights framework, institutions and the claim process.", topics:[
      {name:"Introduction to Forest Rights", files:[{name:"Overview",type:"PDF"},{name:"Intro video",type:"Video"}]},
      {name:"Community Institutions", files:[{name:"Gram Sabha roles",type:"PDF"},{name:"Meeting photo",type:"Image"}]},
      {name:"Claim Process", files:[{name:"Step-by-step guide",type:"PDF"},{name:"Walkthrough",type:"Video"}]}
    ]},
  {id:"pastureland", name:"Pastureland starter", title:"Commoning of Pasturelands", system:"Pastureland", lang:"Hindi",
    desc:"Rules, restoration and sustainable management.", topics:[
      {name:"Introduction to Pasture Commons", files:[{name:"Overview",type:"PDF"}]},
      {name:"Collective Grazing Rules", files:[{name:"Sample rules",type:"PDF"},{name:"Grazing map",type:"Image"}]},
      {name:"Restoration & Management", files:[{name:"Restoration protocol",type:"PDF"},{name:"Before / after",type:"Image"}]}
    ]},
  {id:"water", name:"Water starter", title:"Commoning of Water", system:"Water", lang:"English",
    desc:"Equitable access, governance and stewardship.", topics:[
      {name:"Equitable Access", files:[{name:"Planning guide",type:"PDF"},{name:"Explainer",type:"Video"}]},
      {name:"Stewardship & Monitoring", files:[{name:"Stewardship handbook",type:"PDF"},{name:"Monitoring indicators",type:"Image"}]}
    ]}
];
function useCourseTemplate(id){
  const t=COURSE_TEMPLATES.find(x=>x.id===id);
  if(t){ courseDraft={title:t.title,banner:"course-banner.jpg",desc:t.desc,system:t.system,lang:t.lang,
    topics:t.topics.map(function(tp){return {name:tp.name,files:tp.files.map(function(f){return {name:f.name,type:f.type};})};}),
    sel:0,step:2}; }
  else { courseDraft=newDraft(); }
  toast(t?("Loaded template: "+t.name+" — review & publish"):"Started a blank course");
  go("#/course-new");
}
/* Phase 1 — course details */
function draftSet(field,val){ ensureCourseDraft()[field]=val; }
function draftUploadBanner(){ ensureCourseDraft().banner="course-banner.jpg"; toast("Banner image uploaded (placeholder)"); go("#/course-new"); }
function draftRemoveBanner(){ ensureCourseDraft().banner=""; go("#/course-new"); }
function draftToStep2(){ ensureCourseDraft(); if(!courseDraft.title.trim()){ toast("Please enter a course name"); return; } courseDraft.step=2; go("#/course-new"); }
function draftToStep1(){ ensureCourseDraft().step=1; go("#/course-new"); }
/* Phase 2 — two-pane editor: topics on the left, selected topic's files on the right */
function draftAddTopic(){ ensureCourseDraft(); courseDraft.topics.push({name:"Topic "+(courseDraft.topics.length+1),files:[]}); courseDraft.sel=courseDraft.topics.length-1; go("#/course-new"); }
function draftSelectTopic(i){ ensureCourseDraft().sel=i; go("#/course-new"); }
function draftSetTopicName(i,val){ courseDraft.topics[i].name=val; }
function draftRemoveTopic(i){ ensureCourseDraft().topics.splice(i,1); if(courseDraft.sel>=courseDraft.topics.length) courseDraft.sel=courseDraft.topics.length-1; if(courseDraft.sel<0) courseDraft.sel=0; go("#/course-new"); }
function draftAddFile(type){ ensureCourseDraft(); if(!courseDraft.topics.length) draftAddTopic(); courseDraft.topics[courseDraft.sel].files.push({name:"",type:type||"PDF"}); go("#/course-new"); }
function draftRemoveFile(fi){ courseDraft.topics[courseDraft.sel].files.splice(fi,1); go("#/course-new"); }
function draftSetFile(fi,field,val){ courseDraft.topics[courseDraft.sel].files[fi][field]=val; }
function draftCancel(){ courseDraft=null; go("#/courses"); }
/* Edit an existing published course — load it into the wizard editor */
function editCourse(id){
  const c=courseById(id); if(!c){ toast("Course not found"); return; }
  courseDraft={ editingId:c.id, title:c.title, banner:c.banner||"", desc:c.desc||"", system:c.system, lang:c.lang,
    topics:c.topics.map(function(t){return {name:t.name,files:t.files.map(function(f){return {name:f.name,type:f.type};})};}),
    sel:0, step:1, uploadType:"Image" };
  go("#/course-new");
}
/* Delete a course */
function deleteCourse(id){
  const idx=COURSES.findIndex(function(c){return c.id===id;});
  if(idx<0){ toast("Course not found"); return; }
  const name=COURSES[idx].title; COURSES.splice(idx,1); toast("Course deleted: "+name);
  go(isAdmin()?"#/admin":"#/courses");
}
function publishCourse(){ ensureCourseDraft();
  if(!courseDraft.title.trim()){ toast("Course name is required"); draftToStep1(); return; }
  if(!courseDraft.topics.length){ toast("Add at least one topic before saving"); draftToStep2(); return; }
  const topics=courseDraft.topics.map(function(t,i){return {id:"t"+(i+1),name:(t.name||("Topic "+(i+1))),files:t.files.map(function(f){return {name:f.name,type:f.type};})};});
  if(courseDraft.editingId){
    const c=courseById(courseDraft.editingId);
    if(c){ c.title=courseDraft.title.trim(); c.system=courseDraft.system; c.lang=courseDraft.lang; c.desc=courseDraft.desc; c.banner=courseDraft.banner; c.topics=topics; }
    const id=courseDraft.editingId; courseDraft=null; toast("Course updated"); go("#/course/"+id); return;
  }
  let base=courseDraft.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,24)||"course";
  let uid=base,n=2; while(courseById(uid)){ uid=base+"-"+n; n++; }
  const course={id:uid,title:courseDraft.title.trim(),system:courseDraft.system,lang:courseDraft.lang,desc:courseDraft.desc,banner:courseDraft.banner,topics:topics};
  COURSES.push(course); courseDraft=null; toast("Course published: "+course.title); go("#/course/"+uid);
}

    <div class="cta"><a class="btn sm primary">Open Course →</a></div>
  </div>`;
}
function filterCourses(){
  const q=((document.getElementById("course-search")||{}).value||"").toLowerCase();
  const checked=(fg)=>Array.prototype.slice.call(document.querySelectorAll('.filters input[data-fg="'+fg+'"]:checked')).map(x=>x.value);
  const sys=checked("sys"), langs=checked("lang"), ftypes=checked("ftype");
  return COURSES.filter(c=>{
    if(q){ const hay=(c.title+" "+c.system+" "+c.lang+" "+c.topics.map(t=>t.name).join(" ")).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    if(sys.length && sys.indexOf(c.system)<0) return false;
    if(langs.length && langs.indexOf(c.lang)<0) return false;
    if(ftypes.length){ const types=c.topics.reduce((a,t)=>a.concat(t.files.map(f=>f.type)),[]); if(!ftypes.some(ft=>types.indexOf(ft)>=0)) return false; }
    return true;
  });
}

/* ---- DOCUMENT DETAIL (resource-system subtopic file) — full preview + metadata ---- */
const DOC_CONTRIBUTORS = ["Krishnan Iyer","Meera Nair","Anil Kumar","Sunita Rao","Ravi Menon"];
function docFileSize(type){ const t=(type||"").toLowerCase(); return t==="video"?"48.2 MB":t==="pdf"?"3.7 MB":t==="image"?"1.2 MB":t==="audio"?"12.6 MB":"—"; }
function docCategory(name){ const n=(name||"").toLowerCase();
  if(/note|background|overview|explainer/.test(n)) return "Reference";
  if(/guide|handbook|sop|format|manual/.test(n)) return "How-to";
  if(/map|concept|diagram/.test(n)) return "Reference Map";
  if(/video|intro/.test(n)) return "Learning Video";
  return "Resource"; }
function screensDocMeta(f, s, idx){
  const who = DOC_CONTRIBUTORS[idx % DOC_CONTRIBUTORS.length];
  const initials = who.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  return {
    theme: s?s.name:"Resource System",
    filetype: f.type,
    category: docCategory(f.name),
    visibility: "Public",
    size: docFileSize(f.type),
    version: "v1.0",
    who: who, initials: initials, date: "2026-05-18",
    tags: [s?s.name:"Commons", (f.type||"File"), "Public"]
  };
}
screens.doc = (params) => {
  const s = entityById(params.id);

  if(!topic) return screens["resource-systems"]();
  const group = params.g||"";

  const idx = Math.max(0, Math.min(sub.files.length-1, parseInt(params.i,10)||0));
  const f = sub.files[idx];
  const t = (f.type||"").toLowerCase();
  const meta = screensDocMeta(f, s, idx);

    {label:f.name}
  );
  const bigPrev = t==="video"
      ? `<div class="play" style="width:66px;height:66px;font-size:24px">▶</div><div class="doc-prev-name">${f.name}</div>`
    : t==="image"

  const prevLabel = t==="video"?"Video Preview":t==="image"?"Image Preview":"PDF Preview";
  const metaRow = (label,val)=>`<div class="doc-meta-row"><h5>${label}</h5><div class="doc-meta-val">${val}</div></div>`;
  return shell("#/resource-systems", crumbItems, `

        <div class="panel doc-preview">

          ${metaRow("Theme", meta.theme)}
          ${metaRow("File Type", `<span class="doc-pill">${meta.filetype}</span>`)}
          ${metaRow("Category", meta.category)}
          ${metaRow("Visibility", meta.visibility)}
          ${metaRow("File Size", meta.size)}
          ${metaRow("Version", `<code class="doc-ver">${meta.version}</code>`)}
          <div class="doc-meta-row"><h5>Uploaded By</h5>
            <div class="doc-uploader"><span class="doc-avatar">${meta.initials}</span><div><div style="font-weight:600;font-size:13px">${meta.who}</div><div class="wf-note">${meta.date}</div></div></div>
          </div>
          <div class="doc-meta-row" style="border-bottom:none">
            <h5>Tags</h5>
            <div class="doc-tags">${meta.tags.map(x=>`<span class="doc-tag">🏷 ${x}</span>`).join("")}</div>
          </div>
        </aside>
      </div>

/* Contextual breadcrumb for a resource, based on where the user came from (prevRoute) */
function resourceCrumbs(r){
  const home={label:"Home",href:"#/home"};
  const raw=prevRoute||"";
  const q=raw.indexOf("?")>=0?raw.slice(raw.indexOf("?")+1):"";
  const p=raw.replace(/\?.*$/,"");
  const seg=p.replace(/^#\//,"").split("/"); // e.g. ["modular","pastureland"]
  const topicId=(q.match(/topic=([^&]+)/)||[])[1];
  const here={label:r.title};
  if((seg[0]==="modular"||seg[0]==="system") && SYSTEMS[seg[1]]){
    const s=SYSTEMS[seg[1]];
    const t=topicId?topicById(topicId):null;
    const mid = t? {label:t.name,href:"#/modular/"+seg[1]+"?topic="+topicId} : {label:"Resources",href:"#/system/"+seg[1]};
    return [home,{label:"Resource Systems",href:"#/resource-systems"},{label:s.name,href:"#/system/"+seg[1]},mid,here];
  }
  if(seg[0]==="curriculum" && SYSTEMS[seg[1]]){
    const s=SYSTEMS[seg[1]];
    return [home,{label:"Resource Systems",href:"#/resource-systems"},{label:s.name,href:"#/system/"+seg[1]},{label:"Atomized Course Curriculum",href:"#/curriculum/"+seg[1]},here];
  }
  if(seg[0]==="theme" && THEMES[seg[1]]){
    return [home,{label:"Resource Systems",href:"#/resource-systems"},{label:THEMES[seg[1]].name,href:"#/theme/"+seg[1]},{label:"Resources"},here];
  }
  if(seg[0]==="search") return [home,{label:"Resource Library",href:"#/library"},{label:"Search Results",href:"#/search"},here];
  if(seg[0]==="my-learning") return [home,{label:"My Learning",href:"#/my-learning"},here];
  if(seg[0]==="stage") return [home,{label:"Resource Library",href:"#/library"},here];
  return [home,{label:"Resource Library",href:"#/library"},here];
}

/* restricted-access screen shown when a role lacks permission */
function gateScreen(title, msg){
  return shell(null,
    [{label:"Home",href:"#/home"},{label:title}], `

      <h2>${title}</h2>

        <a class="btn primary" onclick="go('#/login')">Sign In →</a>

}

/* ============================================================
   ROUTER
   ============================================================ */
function parseHash(){
  const raw=(location.hash||"#/home").replace(/^#\//,"");
  const [pathPart,queryPart]=raw.split("?");
  const parts=pathPart.split("/").filter(Boolean);
  const params={};
  if(queryPart){queryPart.split("&").forEach(kv=>{const[k,v]=kv.split("=");params[k]=v;});}
  return {parts,params};
}
function render(){
  if(STATIC_MODE){
    document.body.classList.add("static-mode");
    document.getElementById("app").innerHTML=screens.home({});
    window.scrollTo(0,0);
    return;
  }
  const {parts,params}=parseHash();
  const name=parts[0]||"home";
  let html;
  if(name==="system"){params.id=parts[1];html=screens.system(params);}
  else if(name==="curriculum"){params.id=parts[1];html=screens.curriculum(params);}
  else if(name==="modular"){params.id=parts[1];html=screens.modular(params);}
  else if(name==="theme"){params.id=parts[1];html=screens.theme(params);}
  else if(name==="course"){params.id=parts[1];html=screens.course(params);}
  else if(name==="la"){params.id=parts[1];html=screens.la(params);}
  else if(name==="file"){params.id=parts[1];params.t=parts[2];params.f=parts[3];html=screens.file(params);}
  else if(name==="doc"){params.id=parts[1];html=screens.doc(params);}
  else if(name==="stage"){params.id=parts[1];html=screens.stage(params);}
  else if(name==="resource"){params.id=parts[1];html=screens.resource(params);}
  else if(name==="story"){params.id=parts[1];html=screens.story(params);}
  else if(name==="help"&&parts[1]){params.id=parts[1];html=screens.helptopic(params);}
  else if(screens[name]){html=screens[name](params);}
  else{html=screens.home();}
  document.getElementById("app").innerHTML=html;
  window.scrollTo(0,0);
}
function go(hash){ if(STATIC_MODE) return; if(location.hash===hash){render();} else {location.hash=hash;} }
window.addEventListener("hashchange",function(e){
  if(e && e.oldURL && e.oldURL.indexOf("#")>=0){ prevRoute = e.oldURL.slice(e.oldURL.indexOf("#")); }
  render();
});

let toastTimer;
function toast(msg){
  let t=document.getElementById("wf-toast");
  if(!t){t=document.createElement("div");t.id="wf-toast";
    t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2b2b;color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;z-index:80;max-width:80vw";
    document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity="1";
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.style.opacity="0";},1800);
}
